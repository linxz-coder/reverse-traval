<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>反向旅游好选择</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231657d8'/%3E%3Cstop offset='0.48' stop-color='%231657d8'/%3E%3Cstop offset='0.48' stop-color='%230f8b8d'/%3E%3Cstop offset='1' stop-color='%230f8b8d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #fff;
        --panel-2: #f8fafb;
        --field: #fbfcfe;
        --line: #d8e0ea;
        --line-soft: #e8edf3;
        --text: #141923;
        --muted: #66758a;
        --muted-2: #8793a5;
        --primary: #1657d8;
        --primary-dark: #0e43a8;
        --primary-soft: #edf4ff;
        --accent: #0f8b8d;
        --accent-soft: #e7f6f5;
        --good: #117a45;
        --good-bg: #e9f7ef;
        --warn: #9a5b00;
        --warn-bg: #fff4d7;
        --bad: #b42318;
        --bad-bg: #fff1f0;
        --shadow: 0 14px 34px rgba(21, 35, 54, 0.08);
        --shadow-soft: 0 1px 2px rgba(21, 35, 54, 0.06);
        --shadow-lift: 0 18px 42px rgba(21, 35, 54, 0.11);
      }
      * { box-sizing: border-box; }
      * { min-width: 0; }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, #eaf1f9 0, #f8fafc 230px, var(--bg) 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { text-decoration: underline; }
      .contact-author {
        display: flex;
        align-items: center;
        gap: 7px;
        max-width: calc(100vw - 32px);
        padding: 8px 10px;
        border: 1px solid rgba(22, 87, 216, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(10px);
      }
      .top-actions {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 8px;
        flex: 0 0 auto;
      }
      .contact-author strong {
        color: var(--primary);
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .page {
        width: min(1280px, 100%);
        margin: 0 auto;
        padding: 24px 18px 48px;
      }
      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, var(--primary) 0 48%, var(--accent) 48% 100%);
        box-shadow: 0 7px 18px rgba(22, 87, 216, 0.18);
        flex: 0 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 29px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .sub {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .toolbar, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .toolbar {
        display: grid;
        grid-template-columns: minmax(130px, 0.9fr) minmax(250px, 1.5fr) repeat(5, minmax(118px, 0.75fr)) auto;
        gap: 12px;
        padding: 16px;
        align-items: end;
        position: relative;
      }
      .toolbar::before,
      .nearby-toolbar::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 3px;
        background: var(--primary);
        border-radius: 8px 0 0 8px;
      }
      .nearby-toolbar {
        margin-top: 12px;
        display: grid;
        grid-template-columns: minmax(180px, 0.9fr) minmax(150px, 0.8fr) auto auto minmax(220px, 1.5fr);
        gap: 12px;
        align-items: end;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        position: relative;
      }
      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      input, select, button {
        width: 100%;
        height: 42px;
        border-radius: 8px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: var(--field);
        color: var(--text);
        font-size: 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.72);
        transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }
      input:hover, select:hover {
        border-color: #c2ccd9;
        background: #fff;
      }
      input:focus, select:focus {
        outline: 3px solid rgba(22, 87, 216, 0.12);
        border-color: var(--primary);
        background: #fff;
      }
      .cache-option {
        grid-column: span 2;
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff, var(--panel-2));
        color: var(--text);
        cursor: pointer;
        box-shadow: var(--shadow-soft);
      }
      .cache-option:hover {
        border-color: #c2ccd9;
      }
      .cache-option input[type="checkbox"] {
        width: 18px;
        height: 18px;
        padding: 0;
        margin: 0;
        accent-color: var(--primary);
        flex: 0 0 auto;
      }
      .cache-option strong {
        display: block;
        font-size: 13px;
        line-height: 1.25;
      }
      .cache-option small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.35;
      }
      button {
        border: 0;
        background: linear-gradient(180deg, #1b63e7, var(--primary));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        padding: 0 18px;
        min-width: 116px;
        box-shadow: 0 8px 18px rgba(22, 87, 216, 0.18);
      }
      button:hover {
        background: linear-gradient(180deg, #1659d2, var(--primary-dark));
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(22, 87, 216, 0.22);
      }
      button:active { transform: translateY(0); }
      button:disabled { opacity: 0.76; cursor: wait; }
      .secondary-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: #405066;
        box-shadow: var(--shadow-soft);
      }
      .secondary-btn:hover {
        background: #f3f6fb;
        color: var(--primary);
        box-shadow: 0 8px 18px rgba(21, 35, 54, 0.08);
      }
      .nearby-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        align-self: center;
      }
      .nearby-hint:empty { display: none; }
      .spinner {
        display: none;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border: 2px solid rgba(255,255,255,0.42);
        border-top-color: #fff;
        border-radius: 999px;
        vertical-align: -2px;
        animation: spin 0.8s linear infinite;
      }
      button.loading .spinner { display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .notice {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid #dce6ef;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--muted);
        font-size: 13px;
        box-shadow: var(--shadow-soft);
      }
      .quickbar {
        margin-top: 10px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip-btn, .seg-btn {
        width: auto;
        height: 32px;
        min-width: 0;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.9);
        color: #405066;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: var(--shadow-soft);
      }
      .chip-btn:hover, .seg-btn:hover {
        background: #f3f6fb;
        color: var(--primary);
        transform: translateY(-1px);
      }
      .chip-btn.active, .seg-btn.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }
      .status {
        margin-top: 12px;
        border: 1px solid #b8cdfa;
        background: #eef4ff;
        color: #214784;
        border-radius: 8px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
      }
      .progress-panel {
        margin-top: 10px;
        padding: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-soft);
      }
      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        color: #36445a;
        font-size: 13px;
        font-weight: 800;
      }
      .progress-meta {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .progress-list {
        display: grid;
        gap: 6px;
      }
      .progress-item {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        color: #43536a;
        font-size: 12px;
        line-height: 1.45;
      }
      .progress-item::before {
        content: "";
        width: 7px;
        height: 7px;
        margin-top: 5px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 139, 141, 0.1);
      }
      .error {
        margin-top: 12px;
        color: var(--bad);
        background: var(--bad-bg);
        border: 1px solid #ffd0cc;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
      }
      .hidden { display: none !important; }
      #page-top,
      #area-panel,
      #hotel-results-panel,
      #daily-recommendation {
        scroll-margin-top: 18px;
      }
      .result {
        margin-top: 18px;
        display: grid;
        gap: 14px;
      }
      .panel { overflow: hidden; }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        background: var(--line-soft);
      }
      .stat {
        background: var(--panel);
        padding: 15px;
        min-height: 76px;
      }
      .stat .k {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .stat .v {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.25;
      }
      .area-panel {
        padding: 14px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .section-title {
        margin: 0;
        font-size: 16px;
      }
      .section-meta {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
        text-align: right;
      }
      .area-head-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .area-merge-bar {
        display: grid;
        grid-template-columns: minmax(170px, 1fr) minmax(180px, 260px) auto auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 12px;
        padding: 10px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #fbfcfe;
      }
      .area-merge-meta {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        align-self: center;
      }
      .area-merge-name {
        display: grid;
        gap: 6px;
      }
      .area-merge-name span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .area-merge-bar button {
        min-width: 96px;
      }
      .area-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        max-height: min(58vh, 620px);
        overflow-y: auto;
        padding-right: 4px;
        scroll-padding: 8px;
      }
      .area-card {
        border: 1px solid #dfe6ee;
        border-radius: 8px;
        background: linear-gradient(180deg, #fff, #fbfcfe);
        padding: 12px;
        box-shadow: var(--shadow-soft);
        cursor: pointer;
        text-align: left;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }
      .area-card:hover,
      .area-card:focus {
        border-color: rgba(22, 87, 216, 0.45);
        box-shadow: var(--shadow-lift);
        outline: none;
        transform: translateY(-1px);
      }
      .area-card.active {
        border-color: var(--primary);
        background: linear-gradient(180deg, #f7fbff, #edf4ff);
        box-shadow: 0 0 0 3px rgba(22, 87, 216, 0.12), var(--shadow-soft);
      }
      .area-card.merge-selected {
        border-color: rgba(15, 139, 141, 0.64);
        box-shadow: 0 0 0 3px rgba(15, 139, 141, 0.1), var(--shadow-soft);
      }
      .area-card.merge-pending {
        border-color: rgba(180, 120, 20, 0.5);
        background: linear-gradient(180deg, #fffdf8, #fffbf0);
      }
      .area-name {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 8px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .area-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .area-hotels {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .area-merge-note {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid rgba(180, 120, 20, 0.22);
        border-radius: 7px;
        background: rgba(255, 246, 221, 0.72);
        color: #72511a;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.45;
      }
      .area-merge-status {
        background: #fff2c2;
        color: #7a5414;
      }
      .area-select {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--line-soft);
        color: #405066;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .area-select.disabled {
        color: var(--muted);
        cursor: not-allowed;
      }
      .area-select input[type="checkbox"] {
        width: 16px;
        height: 16px;
        min-width: 16px;
        padding: 0;
        margin: 0;
        accent-color: var(--primary);
        box-shadow: none;
        cursor: pointer;
      }
      .area-select input[type="checkbox"]:disabled {
        cursor: not-allowed;
      }
      .area-card-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }
      .area-rename-link {
        width: 28px;
        height: 28px;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted-2);
        box-shadow: none;
      }
      .area-rename-link:hover,
      .area-rename-link:focus {
        background: #eef3f7;
        color: #5d6b7e;
        text-decoration: none;
        transform: none;
        box-shadow: none;
        outline: none;
      }
      .area-rename-link svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
      }
      .area-rename-link:disabled {
        color: #b5bfca;
        cursor: not-allowed;
        text-decoration: none;
      }
      .daily-panel {
        margin-top: 14px;
        padding: 16px;
      }
      .daily-content {
        display: block;
      }
      .daily-hotel {
        display: grid;
        grid-template-columns: minmax(160px, 220px) minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
        padding: 2px;
      }
      .daily-photo {
        width: 100%;
        grid-row: span 2;
        aspect-ratio: 4 / 3;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        overflow: hidden;
        background: #edf2f7;
      }
      .daily-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .daily-photo-empty {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .daily-info {
        min-width: 0;
      }
      .daily-title {
        font-size: 20px;
        font-weight: 900;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .daily-meta,
      .stage-lane {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .daily-price-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        grid-column: 2 / -1;
      }
      .daily-price {
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: #fff;
        padding: 8px 10px;
      }
      .daily-price .k {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .daily-price .v {
        display: block;
        margin-top: 2px;
        font-size: 16px;
        font-weight: 900;
        line-height: 1.25;
      }
      .daily-price .muted {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.35;
      }
      .daily-feature-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .daily-feature-row .pill {
        background: #f6f8fb;
      }
      .daily-action {
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
      }
      .daily-action a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        box-shadow: 0 8px 18px rgba(22, 87, 216, 0.18);
        white-space: nowrap;
      }
      .daily-action a:hover {
        background: var(--primary-dark);
        text-decoration: none;
        transform: translateY(-1px);
      }
      .stage-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--line-soft);
        background: #fff;
        color: #405066;
        font-size: 12px;
        font-weight: 800;
      }
      .stage-pill.active {
        border-color: rgba(22, 87, 216, 0.35);
        background: var(--primary-soft);
        color: var(--primary);
      }
      .table-head {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line-soft);
        background: linear-gradient(180deg, #fbfcfe, #f5f8fb);
      }
      .table-head-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .table-title {
        flex: 0 0 auto;
        margin: 0;
        font-size: 15px;
      }
      .table-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .choice-filter-bar {
        display: grid;
        grid-template-columns: minmax(150px, 190px) repeat(2, minmax(118px, 150px)) auto minmax(180px, 1fr);
        gap: 10px;
        align-items: end;
        padding: 10px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
      }
      .choice-filter-field {
        gap: 6px;
      }
      .choice-filter-field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .choice-filter-field input,
      .choice-filter-field select {
        height: 36px;
        border-radius: 7px;
        background: #fff;
      }
      .choice-filter-clear {
        width: auto;
        height: 36px;
        min-width: 72px;
        padding: 0 12px;
      }
      .choice-filter-meta {
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .result-search {
        width: min(430px, 100%);
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 38px;

  <body>
    <main class="page" id="page-top">
      <header class="topbar">
        <div>
          <div class="title-row">
            <span class="brand-mark" aria-hidden="true"></span>
            <h1>反向旅游好选择</h1>
          </div>
          <p class="sub">按可选酒店条件筛选，比较大床房/双床房每晚含税均价。</p>
        </div>
        <div class="top-actions">
          <a class="contact-author" href="mailto:lxz@underfitting.com" aria-label="联系作者 lxz@underfitting.com">
            <span>联系作者</span>
            <strong>lxz@underfitting.com</strong>
          </a>
        </div>
      </header>

      <form class="toolbar" id="search-form">
        <label>
          城市
          <input name="city" value="深圳" placeholder="例如：深圳" required />
        </label>
        <label>
          法定假期
          <select name="holiday_code" id="holiday-select" required></select>
        </label>
        <label>
          最低每晚含税
          <input name="min_price" type="number" min="0" placeholder="不限" />
        </label>
        <label>
          最高每晚含税
          <input name="max_price" type="number" min="0" placeholder="不限" />
        </label>
        <label>
          高级酒店
          <select name="advanced_filter">
            <option value="all" selected>全部</option>
            <option value="yes">是</option>
            <option value="no">否</option>
          </select>
        </label>
        <label>
          有游泳池
          <select name="pool_filter">
            <option value="all" selected>全部</option>
            <option value="yes">是</option>
            <option value="no">否</option>
          </select>
        </label>
        <label>
          儿童设施
          <select name="child_facility_filter">
            <option value="all" selected>全部</option>
            <option value="yes">是</option>
            <option value="no">否</option>
          </select>
        </label>
        <label class="cache-option" title="优先显示缓存结果">
          <input id="use-cache" name="use_cache" type="checkbox" value="true" checked />
          <span>
            <strong>优先显示缓存结果</strong>
            <small>推荐勾选显示缓存结果，新搜索预估耗时10-15分钟</small>
          </span>
        </label>
        <button id="submit-btn" type="submit"><span class="spinner"></span><span id="submit-text">开始筛选</span></button>
      </form>

      <form class="nearby-toolbar" id="nearby-form">
        <label>
          从所在城市找周边
          <select id="origin-province" name="origin_province"></select>
        </label>
        <label>
          城市
          <select id="origin-city" name="origin_city"></select>
        </label>
        <button class="secondary-btn" id="geo-btn" type="button">用当前位置</button>
        <button id="nearby-submit-btn" type="submit"><span class="spinner"></span><span id="nearby-submit-text">搜索周边城市</span></button>
        <div class="nearby-hint" id="nearby-hint"></div>
      </form>

      <div class="notice">
        <span>筛选口径：假期每晚均价不高于未来代表时段每晚均价 +100 元。</span>
      </div>
      <div class="quickbar" aria-label="价格快捷筛选">
        <button class="chip-btn" type="button" data-price-range="">不限</button>
        <button class="chip-btn" type="button" data-price-range="0-500">500 以下</button>
        <button class="chip-btn" type="button" data-price-range="500-800">500-800</button>
        <button class="chip-btn" type="button" data-price-range="800-1200">800-1200</button>
        <button class="chip-btn" type="button" data-price-range="1200-">1200 以上</button>
      </div>

      function makeClientId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
      }

      function getClientId() {
        const key = "reverseTravelClientId";
        try {
          const existing = window.sessionStorage.getItem(key);
          if (existing) return existing;
          const value = makeClientId();
          window.sessionStorage.setItem(key, value);
          return value;
        } catch {
          return makeClientId();
        }
      }

      function jobPayload(payload) {
        return { ...(payload || {}), client_id: clientId };
      }

      function jobHeaders(includeJson = false) {
        const headers = { "X-Reverse-Travel-Client": clientId };
        if (includeJson) headers["Content-Type"] = "application/json";
        return headers;
      }

        floatingNavToggle.setAttribute("aria-expanded", open ? "true" : "false");

      }

      function floatingNavCountText(value) {
        const count = Math.max(0, Math.round(Number(value || 0)));
        if (!Number.isFinite(count)) return "0";
        return count > 99 ? "99+" : String(count);
      }

      function updateFloatingNavCounts({ areaCount, hotelCount } = {}) {
        if (areaCount !== undefined && floatingAreaCount) {

      function targetIsScrollable(target) {
        if (!target) return false;
        const style = window.getComputedStyle(target);
        if (style.display === "none" || style.visibility === "hidden") return false;
        return target.getClientRects().length > 0;

      function pollUrlWithVersion(pollUrl, version) {
        const url = new URL(pollUrl, window.location.origin);
        if (version) url.searchParams.set("since_version", String(version));
        return url.pathname + url.search + url.hash;
      }

      function esc(text) {
        return String(text || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const t2sPhrases = [
        ["希爾頓花園酒店", "希尔顿花园酒店"],
        ["洲際酒店", "洲际酒店"],
        ["凱悅酒店", "凯悦酒店"],
        ["格蘭雲天", "格兰云天"],
        ["維也納酒店", "维也纳酒店"],
        ["深圳國際會展中心", "深圳国际会展中心"],
        ["光明虹橋", "光明虹桥"],
      ];
      const t2sChars = {
        "廣": "广", "東": "东", "門": "门", "雲": "云", "國": "国", "際": "际", "會": "会",
        "灣": "湾", "橋": "桥", "園": "园", "華": "华", "凱": "凯", "悅": "悦", "爾": "尔",
        "頓": "顿", "維": "维", "納": "纳", "蘭": "兰", "瀾": "澜", "麗": "丽", "濱": "滨",
        "樓": "楼", "閣": "阁", "館": "馆", "莊": "庄", "龍": "龙", "寧": "宁", "蘇": "苏",
        "縣": "县", "區": "区", "內": "内", "陽": "阳", "長": "长", "慶": "庆", "達": "达",
        "連": "连", "濟": "济", "鄭": "郑", "漢": "汉", "貴": "贵", "樂": "乐", "兒": "儿",
        "親": "亲", "雙": "双", "張": "张", "萬": "万", "與": "与", "裏": "里", "裡": "里",
        "臺": "台", "島": "岛", "飯": "饭", "體": "体", "號": "号", "潔": "洁", "寶": "宝",
        "緣": "缘", "錦": "锦", "匯": "汇", "恆": "恒", "榮": "荣", "業": "业", "廈": "厦",
        "廳": "厅", "營": "营", "適": "适", "選": "选", "鄰": "邻", "韓": "韩", "歐": "欧",
        "羅": "罗", "倫": "伦", "紐": "纽", "舊": "旧", "聖": "圣", "鬆": "松", "豐": "丰",
        "齋": "斋", "齊": "齐", "淺": "浅", "澀": "涩", "環": "环", "購": "购", "碼": "码",
        "櫚": "榈", "壯": "壮", "劇": "剧", "鐵": "铁", "盧": "卢", "奧": "奥", "馬": "马"
      };

      function simplifyChineseText(text) {
        let value = String(text || "");
        for (const [from, to] of t2sPhrases) value = value.split(from).join(to);
        return Array.from(value).map((char) => t2sChars[char] || char).join("");
      }

      function hasChineseText(text) {
        return /[\u3400-\u9fff]/.test(String(text || ""));
      }

      function chineseCharCount(text) {
        return (String(text || "").match(/[\u3400-\u9fff]/g) || []).length;
      }

      function normalizeSearchText(text) {
        return simplifyChineseText(text)
          .toLowerCase()
          .replace(/[\s\-_,.()（）·•|｜\/\\:："'“”‘’]+/g, "");
      }

      function hotelCityAliases(item) {
        const values = [
          item?.recommend_city,
          lastResultCity,
          form?.elements?.city?.value,
        ];
        const aliases = new Set();
        values.forEach((value) => {
          const token = normalizeSearchText(value || "");
          if (!token) return;
          aliases.add(token);
          const stripped = token.replace(/(特别行政区|自治州|地区|市|区|县)$/u, "");
          if (stripped) aliases.add(stripped);
        });
        return aliases;
      }

      function isGenericOrCityHotelName(name, item) {
        const value = simplifyChineseText(name || "").trim();
        const token = normalizeSearchText(value);
        if (!token) return true;
        if (["酒店", "宾馆", "住宿", "酒店民宿", "民宿", "国内酒店", "海外酒店", "tripcom"].includes(token)) {
          return true;
        }
        const cityAliases = hotelCityAliases(item);
        const suffixes = ["酒店", "宾馆", "住宿", "民宿", "酒店预订", "住宿预订"];
        if (cityAliases.has(token)) return true;
        for (const city of cityAliases) {
          if (suffixes.some((suffix) => token === normalizeSearchText(`${city}${suffix}`))) return true;
        }
        return /携程|去哪儿|飞猪|酒店预订|宾馆预订|价格查询|Trip\.com/i.test(value);
      }

      function hotelNameNeedsRefresh(item) {
        if (!item) return false;
        if (item.hotel_name_needs_refresh) return true;
        const name = simplifyChineseText(item.hotel_name || "").trim();
        if (!name) return true;
        if (!hasChineseText(name)) return true;
        if (isGenericOrCityHotelName(name, item)) return true;
        return chineseCharCount(name) < 4;
      }

      function displayHotelName(item) {
        const name = String(item?.hotel_name || "").trim();
        if (!hotelNameNeedsRefresh(item)) return simplifyChineseText(name);
        const originalName = String(item?.hotel_original_name || "").trim();
        if (originalName && normalizeSearchText(originalName) !== normalizeSearchText(name)) {
          return simplifyChineseText(originalName);
        }
        if (name && !isGenericOrCityHotelName(name, item)) return simplifyChineseText(name);
        return "酒店名匹配中";
      }

      function hotelNameSourceLabel(item) {
        const source = String(item?.hotel_name_source || "").trim();
        if (!source) return "";
        return hotelNameNeedsRefresh(item) ? "" : source;
      }

      function choiceSearchText(item) {
        const aliases = Array.isArray(item.hotel_name_aliases) ? item.hotel_name_aliases : [];
        return normalizeSearchText([
          item.hotel_name,
          item.hotel_original_name,
          item.hotel_name_simplified,
          item.hotel_search_name,
          item.area_name,
          item.area_hint,
          item.recommend_city,
          ...aliases,
        ].filter(Boolean).join(" "));
      }

      function choiceKey(item, index) {
        if (item && item._choice_key) return String(item._choice_key);
        const hotelId = item && item.hotel_id ? String(item.hotel_id) : "";
        const roomType = item && (item.room_type || item.holiday_room_name) ? String(item.room_type || item.holiday_room_name) : "";
        const city = item && item.recommend_city ? String(item.recommend_city) : "";
        if (hotelId) return `${city}:${hotelId}:${roomType}`;
        if (item && item.detail_url) return `${city}:${item.detail_url}:${roomType}`;
        return `${city}:${index}`;
      }

      function choiceByKey(key) {
        return lastChoices.find((item, index) => choiceKey(item, index) === key) || null;
      }

      function mergeChoiceUpdates(updatedChoices, fields = null) {
        if (!Array.isArray(updatedChoices) || !updatedChoices.length) return;
        const byKey = new Map(lastChoices.map((item, index) => [choiceKey(item, index), item]));
        updatedChoices.forEach((updated, index) => {
          const key = choiceKey(updated, index);
          const existing = byKey.get(key);
          if (!existing && Array.isArray(fields)) return;
          if (!existing) {
            const appended = { ...updated };
            lastChoices.push(appended);
            byKey.set(key, appended);
            return;
          }
          if (Array.isArray(fields)) {
            fields.forEach((field) => {
              if (Object.prototype.hasOwnProperty.call(updated, field)) existing[field] = updated[field];
            });
            if (
              fields.includes("hotel_name_needs_refresh")
              && !Object.prototype.hasOwnProperty.call(updated, "hotel_name_needs_refresh")
            ) {
              const previousRefreshFlag = existing.hotel_name_needs_refresh;
              delete existing.hotel_name_needs_refresh;
              if (hotelNameNeedsRefresh(existing)) existing.hotel_name_needs_refresh = previousRefreshFlag || true;
            }
          } else {
            Object.assign(existing, updated);
          }
        });
        applyApprovedHotelNameCorrections();
        applyApprovedHotelAreaCorrections();
      }

      function mergeResultDelta(base, delta) {
        if (!delta) return base || null;
        const next = { ...(base || {}), ...(delta.meta || {}) };
        const byKey = new Map();
        (base?.choices || []).forEach((item, index) => {
          byKey.set(choiceKey(item, index), { ...item });
        });
        (delta.choices_removed || []).forEach((key) => byKey.delete(String(key)));
        (delta.choices_upsert || []).forEach((item, index) => {
          if (!item) return;
          const key = choiceKey(item, index);
          const existing = byKey.get(key) || {};
          const merged = { ...existing, ...item };
          delete merged._choice_key;
          byKey.set(key, merged);
        });
        const order = Array.isArray(delta.choice_order) ? delta.choice_order.map(String) : [];
        if (order.length) {
          next.choices = order.map((key) => byKey.get(key)).filter(Boolean);
          byKey.forEach((value, key) => {
            if (!order.includes(key)) next.choices.push(value);
          });
        } else {
          next.choices = Array.from(byKey.values());
        }
        if (!Array.isArray(next.area_recommendations)) next.area_recommendations = base?.area_recommendations || [];
        return next;
      }

      function initOriginCitySelector() {
        originProvince.innerHTML = provinceCityOptions.map((item) =>
          `<option value="${esc(item.province)}">${esc(item.province)}</option>`
        ).join("");
        setOriginCity("深圳");
        originProvince.addEventListener("change", () => {
          populateOriginCities(originProvince.value);

      function populateOriginCities(province, selectedCity = "") {
        const provinceItem = provinceCityOptions.find((item) => item.province === province) || provinceCityOptions[0];
        const cities = provinceItem ? provinceItem.cities : [];
        originCity.innerHTML = cities.map((city) =>
          `<option value="${esc(city)}">${esc(city)}</option>`
        ).join("");
        const nextCity = cities.includes(selectedCity) ? selectedCity : (cities[0] || "");
        if (nextCity) originCity.value = nextCity;
      }

      function setOriginCity(city) {
        const normalizedCity = String(city || "").trim();
        const provinceItem = provinceCityOptions.find((item) => (item.cities || []).includes(normalizedCity));
        const fallbackProvince = provinceCityOptions.find((item) => item.province === "广东") || provinceCityOptions[0];
        const nextProvince = provinceItem || fallbackProvince;
        if (!nextProvince) return;
        originProvince.value = nextProvince.province;
        populateOriginCities(nextProvince.province, provinceItem ? normalizedCity : "深圳");
      }

      function setLoading(active) {
        submitBtn.disabled = active;
        nearbySubmitBtn.disabled = active;
        geoBtn.disabled = active;
        submitBtn.classList.toggle("loading", active && currentRequestKind === "single");
        nearbySubmitBtn.classList.toggle("loading", active && currentRequestKind === "nearby");
        submitText.textContent = active && currentRequestKind === "single" ? "筛选中" : "开始筛选";
        nearbySubmitText.textContent = active && currentRequestKind === "nearby" ? "推荐中" : "搜索周边城市";
        statusBox.classList.toggle("hidden", !active);
        if (!active) {
          window.clearInterval(timer);
          timer = null;
          return;
        }
        startedAt = Date.now();
        lastProgressMessage = "";
        progressList.innerHTML = "";
        progressMeta.textContent = "";
        progressPanel.classList.remove("hidden");
        statusText.textContent = loadingMessage(0);
        updateElapsed();
        timer = window.setInterval(updateElapsed, 1000);
      }

      function loadingMessage(seconds) {
        if (currentRequestKind === "nearby") {
          if (currentUseCache) {
            return "正在读取周边城市缓存；没有缓存会自动逐城新搜索。";
          }
          return seconds > 45 ? "正在逐城比较周边城市价格，可能需要 5-15 分钟..." : "正在逐城新搜索周边城市，可能需要 5-15 分钟...";
        }
        if (currentUseCache) {
          return "正在读取缓存；如未命中会自动新搜索。";
        }
        return seconds > 45 ? "正在比较多个代表日期的含税均价..." : "正在进行新搜索，通常需要 2-5 分钟...";
      }

      function updateElapsed() {
        const seconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
        const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
        const ss = String(seconds % 60).padStart(2, "0");
        elapsed.textContent = `${mm}:${ss}`;
        statusText.textContent = lastProgressMessage || loadingMessage(seconds);
        if (seconds > 120 && !lastProgressMessage) {
          statusText.textContent = "正在补全酒店中文名和整理结果...";
        }
      }

      function diffClass(value) {
        const n = Number(value || 0);
        if (n <= 0) return "good";
        if (n <= 100) return "warn";
        return "bad";
      }

      function formatPriceText(value) {
        return String(value || "")
          .replace(/^Total price:\s*/i, "")
          .replace(/^Avg\.?\s*nightly:\s*/i, "")
          .trim();
      }

      function stageLabel(stage) {
        const labels = {
          prepare: "准备",
          mysql_price_preview: "价格缓存",
          stale_cache_preview: "历史缓存",
          resolve_city: "城市识别",
          fast_holiday_hotels: "首屏酒店",
          fast_comparison_hotels: "快速对比",
          fast_preview: "首屏预览",
          holiday_hotels: "假期列表",
          comparison_hotels: "代表时段",
          pricing_preview: "价格预览",
          supplemental_hotels: "重点片区",
          supplemental_preview: "补充预览",
          initial_verify_features: "初筛核验",
          initial_verified_preview: "核验预览",
          deep_holiday_hotels: "深扫酒店",
          deep_comparison_hotels: "深扫对比",
          deep_pricing_progress: "深扫价格",
          deep_pricing_preview: "深扫预览",
          deep_pricing_complete: "深扫完成",
          verify_features: "设施核验",
          verified_preview: "核验完成",
          cached_chinese_names: "中文缓存",
          cached_names_preview: "中文预览",
          coverage: "行政区补充",
          coverage_preview: "补充预览",
          hotel_names: "中文名",
          areas: "区域规范化",
          finalize: "整理结果",
          succeeded: "完成",
        };
        return labels[stage] || stage || "进度";
      }

      function resultStageFromData(data) {
        const stage = data?.partial?.stage || "";
        if (stage) return stage;
        if (data && Array.isArray(data.choices)) return "succeeded";
        return "";
      }

      function isCompleteCoverageResult(data) {
        const status = data?.coverage_supplement?.status || "";
        return status === "succeeded" || status === "skipped";
      }

      function renderSummary(data) {
        const currentAreas = mergeAreaLists(
          data.area_recommendations || [],
          buildAreasFromChoices(data.choices || [])
        );
        const areaCount = mergeAreaLists(
          currentAreas,
          lastServerAreas
        ).length;
        if (data.origin_city) {
          summary.innerHTML = `
            <div class="stat"><div class="k">周边推荐起点</div><div class="v">${esc(data.origin_city)}</div></div>
            <div class="stat"><div class="k">实际搜索城市</div><div class="v">${esc((data.nearby_cities || []).join("、"))}</div></div>
            <div class="stat"><div class="k">命中酒店</div><div class="v">${esc((data.choices || []).length)} 家</div></div>
            <div class="stat"><div class="k">推荐区域</div><div class="v">${esc(areaCount)} 个</div></div>
          `;
        } else {
          summary.innerHTML = `
            <div class="stat"><div class="k">城市</div><div class="v">${esc(data.city)}</div></div>
            <div class="stat"><div class="k">假期</div><div class="v">${esc(data.holiday.name)}</div></div>
            <div class="stat"><div class="k">入住时段</div><div class="v">${esc(data.holiday.check_in)} 至 ${esc(data.holiday.check_out)}</div></div>
            <div class="stat"><div class="k">推荐区域</div><div class="v">${esc(areaCount)} 个</div></div>
          `;
        }
        lastComparisonCount = (data.comparison_windows || []).length;
      }

      function areaFilterKey(areaName, recommendCity = "") {
        return `${normalizeSearchText(areaName)}::${normalizeSearchText(recommendCity)}`;
      }

      function areaAliases(area) {
        const names = [area?.area_name, ...(Array.isArray(area?.merged_area_names) ? area.merged_area_names : [])];
        const seen = new Set();
        const aliases = [];
        names.forEach((name) => {
          const value = simplifyChineseText(name || "");
          const key = normalizeSearchText(value);
          if (!value || seen.has(key)) return;
          seen.add(key);
          aliases.push(value);
        });
        return aliases;
      }

      function matchesActiveArea(item) {
        if (!activeAreaFilter) return true;
        const itemArea = normalizeSearchText(item.area_name || "");
        const itemCity = normalizeSearchText(item.recommend_city || "");
        return activeAreaFilter.areas.has(itemArea) && (!activeAreaFilter.city || itemCity === activeAreaFilter.city);
      }

      function numericValue(value) {
        if (value === null || value === undefined || value === "") return NaN;
        const number = Number(value);
        if (Number.isFinite(number)) return number;
        const match = String(value).replaceAll(",", "").match(/-?\d+(?:\.\d+)?/);
        return match ? Number(match[0]) : NaN;
      }

      function choicePriceValue(item) {
        const direct = numericValue(item?.holiday_avg_nightly_tax_total_value);
        if (Number.isFinite(direct)) return direct;
        return numericValue(item?.holiday_avg_nightly_tax_total_price);
      }

      function choiceDiscountValue(item) {
        const direct = numericValue(item?.price_diff_nightly);
        if (Number.isFinite(direct)) return direct;
        return numericValue(item?.price_diff_nightly_text);
      }

      function normalizedPriceFilterValue(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        const number = Number(text);
        return Number.isFinite(number) && number >= 0 ? number : "";
      }

      function resultPriceFilterBounds() {
        let minPrice = resultMinPriceFilter;
        let maxPrice = resultMaxPriceFilter;
        if (minPrice !== "" && maxPrice !== "" && minPrice > maxPrice) {
          [minPrice, maxPrice] = [maxPrice, minPrice];
        }
        return { minPrice, maxPrice };
      }

      function compareFinite(left, right, direction = 1) {
        const leftOk = Number.isFinite(left);
        const rightOk = Number.isFinite(right);
        if (!leftOk && !rightOk) return 0;
        if (!leftOk) return 1;
        if (!rightOk) return -1;
        return (left - right) * direction;
      }

      function sortVisibleChoices(items) {
        if (resultSortMode === "default") return items;
        const sorted = items.slice();
        sorted.sort((a, b) => {
          const priceCompare = compareFinite(choicePriceValue(a), choicePriceValue(b), resultSortMode === "price_desc" ? -1 : 1);
          const discountCompare = compareFinite(choiceDiscountValue(a), choiceDiscountValue(b), resultSortMode === "discount_asc" ? -1 : 1);
          if (resultSortMode === "price_asc" || resultSortMode === "price_desc") {
            return priceCompare || discountCompare || String(displayHotelName(a)).localeCompare(String(displayHotelName(b)), "zh-Hans-CN");
          }
          if (resultSortMode === "discount_desc" || resultSortMode === "discount_asc") {
            return discountCompare || priceCompare || String(displayHotelName(a)).localeCompare(String(displayHotelName(b)), "zh-Hans-CN");
          }
          return 0;
        });
        return sorted;
      }

      function currentResultPriceRange() {
        const prices = lastChoices
          .map(choicePriceValue)
          .filter((value) => Number.isFinite(value) && value >= 0);
        if (!prices.length) return null;
        return {
          min: Math.floor(Math.min(...prices)),
          max: Math.ceil(Math.max(...prices)),
        };
      }

      function updateResultFilterRangeMeta() {
        const range = currentResultPriceRange();
        if (!range) {
          resultMinPriceInput.placeholder = "不限";
          resultMaxPriceInput.placeholder = "不限";
          resultPriceRangeMeta.textContent = "";
          return;
        }
        resultMinPriceInput.placeholder = String(range.min);
        resultMaxPriceInput.placeholder = String(range.max);
        resultPriceRangeMeta.textContent = `本次结果价格：CNY ${range.min} - ${range.max}`;
      }

      function resultListFilterText() {
        const parts = [];
        const { minPrice, maxPrice } = resultPriceFilterBounds();
        if (resultSortMode !== "default") {
          const label = resultSortSelect.options[resultSortSelect.selectedIndex]?.textContent || "";
          if (label) parts.push(label);
        }
        if (minPrice !== "" || maxPrice !== "") {
          parts.push(`价格 CNY ${minPrice === "" ? "不限" : minPrice} - ${maxPrice === "" ? "不限" : maxPrice}`);
        }
        return parts.length ? `，列表筛选：${parts.join("，")}` : "";
      }

      function hasResultListFilter() {
        return resultSortMode !== "default" || resultMinPriceFilter !== "" || resultMaxPriceFilter !== "";
      }

      function visibleChoices(options = {}) {
        let items = lastChoices;
        if (activeView === "lower") {
          items = items.filter((item) => Number(item.price_diff_nightly || 0) <= 0);
        } else if (activeView === "slight") {
          items = items.filter((item) => {
            const diff = Number(item.price_diff_nightly || 0);
            return diff > 0 && diff <= 100;
          });
        }
        if (resultSearchQuery) {
          items = items.filter((item) => choiceSearchText(item).includes(resultSearchQuery));
        }
        const { minPrice, maxPrice } = resultPriceFilterBounds();
        if (minPrice !== "" || maxPrice !== "") {
          items = items.filter((item) => {
            const price = choicePriceValue(item);
            if (!Number.isFinite(price)) return false;
            if (minPrice !== "" && price < minPrice) return false;
            if (maxPrice !== "" && price > maxPrice) return false;
            return true;
          });
        }
        if (!options.ignoreAreaFilter) {
          items = items.filter(matchesActiveArea);
        }
        return sortVisibleChoices(items);
      }

      function exportFilterSummary() {
        const parts = [];
        const viewLabels = { all: "全部", lower: "假期更低", slight: "略高可接受" };
        if (activeView && activeView !== "all") parts.push(`结果类型：${viewLabels[activeView] || activeView}`);
        if (activeAreaFilter?.label) parts.push(`片区：${activeAreaFilter.label}`);
        if (resultSearchQuery && resultSearchInput.value.trim()) parts.push(`搜索：${resultSearchInput.value.trim()}`);
        const listFilter = resultListFilterText().replace(/^，/, "");
        if (listFilter) parts.push(listFilter);
        return parts.length ? parts.join("，") : "当前已展示结果";
      }

      function exportReportTitle() {
        const city = lastResultCity || simplifyChineseText(form?.elements?.city?.value || "");
        const holiday = holidaySelect?.selectedOptions?.[0]?.textContent?.trim() || "";
        return ["反向旅游搜索结果", city, holiday].filter(Boolean).join(" - ");
      }

      function exportAreaSummaryHtml(items) {
        const areas = buildAreasFromChoices(items);
        if (!areas.length) return "";
        return `
          <section>
            <h2>推荐旅游区域</h2>
            <table>
              <thead>
                <tr>
                  <th>片区</th>

                  <th>酒店数</th>
                  <th>更低</th>
                  <th>假期均价</th>
                  <th>每晚差额</th>
                </tr>
              </thead>
              <tbody>
                ${areas.map((area) => `
                  <tr>
                    <td>${esc(area.area_name || "-")}</td>
                    <td>${esc(area.recommend_city || "-")}</td>
                    <td>${esc(area.hotel_count || 0)}</td>
                    <td>${esc(area.lower_price_hotel_count || 0)}</td>
                    <td>${esc(area.average_holiday_nightly_tax_total_price || "-")}</td>
                    <td>${esc(area.average_price_diff_nightly_text || "-")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
        `;
      }

      function exportHotelRowsHtml(items) {
        return items.map((item, index) => {
          const hotelName = displayHotelName(item);
          const areaText = [item.recommend_city, item.area_name].filter(Boolean).map(simplifyChineseText).join(" · ") || "-";
          const detailUrl = String(item.detail_url || "").trim();
          return `
            <tr>
              <td>${esc(index + 1)}</td>
              <td>
                <strong>${esc(hotelName)}</strong>

                ${detailUrl ? `<div class="muted"><a href="${esc(detailUrl)}">${esc(detailUrl)}</a></div>` : ""}
              </td>
              <td>${esc(areaText)}</td>
              <td>${esc(item.holiday_avg_nightly_tax_total_price || "-")}<div class="muted">整段：${esc(formatPriceText(item.holiday_tax_total_price) || "-")}</div></td>

          printWindow.print();

      function rowFromHtml(html) {
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        return template.content.firstElementChild;
      }

      function renderChoiceRows(items) {
        const existingRows = new Map();
        choicesBody.querySelectorAll("tr[data-choice-key]").forEach((row) => {
          existingRows.set(row.dataset.choiceKey, row);
        });
        const nextRows = [];
        items.forEach((item, index) => {
          const key = choiceKey(item, index);
          const signature = choiceRenderSignature(item);
          const existing = existingRows.get(key);
          if (existing && existing.dataset.choiceSignature === signature) {
            nextRows.push(existing);
            return;
          }
          nextRows.push(rowFromHtml(choiceRowHtml(item, key, signature)));
        });
        choicesBody.replaceChildren(...nextRows);
      }

      function renderChoices() {
        if (renderChoicesTimer) {
          window.clearTimeout(renderChoicesTimer);
          renderChoicesTimer = null;

        const totalChoiceCount = Math.max(lastTotalChoiceCount || 0, lastChoices.length);

      function hotelNameRefreshChoices(data, options = {}) {
        const choices = Array.isArray(data?.choices) ? data.choices : [];

          if (hotelNameNeedsRefresh(item)) return true;
          const source = String(item.hotel_name_source || "").trim();
          if (["携程酒店", "去哪儿酒店", "飞猪酒店", "Trip.com 简体", "Trip.com HK", "人工审核中文名"].includes(source)) return false;
          const name = String(item.hotel_name || "");
          return !source && !hasChineseText(name);
        });
        return options.partial ? targets.slice(0, HOTEL_NAME_PARTIAL_REFRESH_LIMIT) : targets;

      function hotelNameRefreshSignature(data, choices) {
        return [
          data?.city || "",

          const sameSource = item.hotel_name_source === "人工审核中文名";
          if (sameName && sameSource && !item.hotel_name_needs_refresh) return item;
          changed = true;
          const originalName = item.hotel_original_name || record.hotel_name_original || item.hotel_name || "";
          const next = {

            hotel_name_source: "人工审核中文名",
