      function numericCoordinate(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function hotelCoordinatePair(item) {
        const latitude = numericCoordinate(item?.latitude);
        const longitude = numericCoordinate(item?.longitude);
        if (latitude === null || longitude === null) return null;
        if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) return null;
        return { latitude, longitude };
      }

      function coordinateDistanceKm(left, right) {
        if (!left || !right) return null;
        const radiusKm = 6371;
        const toRad = (value) => value * Math.PI / 180;
        const dLat = toRad(right.latitude - left.latitude);
        const dLon = toRad(right.longitude - left.longitude);
        const lat1 = toRad(left.latitude);
        const lat2 = toRad(right.latitude);
        const a = Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
        return 2 * radiusKm * Math.asin(Math.min(1, Math.sqrt(a)));
      }

      function comparableAreaText(areaName, cityName = "") {
        let text = normalizeSearchText(areaName);
        const city = normalizeSearchText(cityName);
        if (city && text.startsWith(city)) text = text.slice(city.length);
        return text.replace(/(旅游度假区|度假区|风景区|景区|商圈|商业区|商务区|中心区|核心区|附近|周边|片区|区域)$/g, "");
      }

      function editDistance(left, right) {
        const a = Array.from(left || "");
        const b = Array.from(right || "");
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        const previous = Array.from({ length: b.length + 1 }, (_, index) => index);
        for (let i = 0; i < a.length; i += 1) {
          const current = [i + 1];
          for (let j = 0; j < b.length; j += 1) {
            current[j + 1] = Math.min(
              current[j] + 1,
              previous[j + 1] + 1,
              previous[j] + (a[i] === b[j] ? 0 : 1)
            );
          }
          previous.splice(0, previous.length, ...current);
        }
        return previous[b.length];
      }

      function areaNameSimilarity(input, candidate, cityName = "") {
        const left = comparableAreaText(input, cityName);
        const right = comparableAreaText(candidate, cityName);
        if (!left || !right) return 0;
        if (left === right) return 1;
        if (left.includes(right) || right.includes(left)) return 0.88;
        const leftChars = new Set(Array.from(left));
        const rightChars = new Set(Array.from(right));
        const overlap = Array.from(leftChars).filter((char) => rightChars.has(char)).length;
        const overlapScore = overlap / Math.max(leftChars.size, rightChars.size, 1);
        const distanceScore = 1 - editDistance(left, right) / Math.max(left.length, right.length, 1);
        return Math.max(0, overlapScore, distanceScore);
      }

      function areaSuggestionCandidates(item) {
        const itemCity = simplifyChineseText(item?.recommend_city || lastResultCity || "");
        const itemCityKey = normalizeSearchText(itemCity);
        const currentAreaKey = normalizeSearchText(item?.area_name || "");
        const itemCoords = hotelCoordinatePair(item);
        const groups = new Map();
        const addArea = (areaName, cityName, source, hotelCount = 0, coords = null) => {
          const name = simplifyChineseText(areaName || "");
          const city = simplifyChineseText(cityName || itemCity || "");
          if (!name || isGenericAreaName(name)) return;
          if (normalizeSearchText(name) === currentAreaKey) return;
          const cityKey = normalizeSearchText(city);
          if (itemCityKey && cityKey && cityKey !== itemCityKey) return;
          const key = areaFilterKey(name, city);
          const existing = groups.get(key) || {
            area_name: name,
            recommend_city: city,
            hotel_count: 0,
            sources: new Set(),
            lat_sum: 0,
            lon_sum: 0,
            coord_count: 0,
          };
          existing.hotel_count = Math.max(existing.hotel_count, Number(hotelCount || 0));
          existing.sources.add(source);
          if (coords) {
            existing.coord_count += 1;
            existing.lat_sum += coords.latitude;
            existing.lon_sum += coords.longitude;
          }
          groups.set(key, existing);
        };

        mergeAreaLists(lastServerAreas, buildAreasFromChoices(lastChoices)).forEach((area) => {
          addArea(area.area_name, area.recommend_city, "推荐片区", area.hotel_count || 0);
        });
        lastChoices.forEach((choice) => {
          const areaName = choice.area_name || "";
          if (!areaName) return;
          addArea(areaName, choice.recommend_city || itemCity, "同城酒店", 1, hotelCoordinatePair(choice));
        });

        return Array.from(groups.values()).map((group) => {
          const center = group.coord_count
            ? { latitude: group.lat_sum / group.coord_count, longitude: group.lon_sum / group.coord_count }
            : null;
          return {
            area_name: group.area_name,
            recommend_city: group.recommend_city,
            hotel_count: group.hotel_count,
            source: Array.from(group.sources).join("、"),
            distance_km: coordinateDistanceKm(itemCoords, center),
          };
        });
      }

      function areaCorrectionSuggestions(item, query) {
        const cityName = simplifyChineseText(item?.recommend_city || lastResultCity || "");
        const normalizedQuery = simplifyChineseText(query || "").trim();
        const candidates = areaSuggestionCandidates(item).map((candidate) => ({
          ...candidate,
          similarity: normalizedQuery ? areaNameSimilarity(normalizedQuery, candidate.area_name, cityName) : 0,
        }));
        const byNearby = [...candidates]
          .filter((item) => Number.isFinite(item.distance_km))
          .sort((a, b) => a.distance_km - b.distance_km || b.hotel_count - a.hotel_count)
          .slice(0, 4);
        const bySimilarity = normalizedQuery
          ? [...candidates]
              .filter((item) => item.similarity >= 0.38)
              .sort((a, b) => b.similarity - a.similarity || (a.distance_km ?? 9999) - (b.distance_km ?? 9999))
              .slice(0, 4)
          : [];
        const byCount = [...candidates]
          .sort((a, b) => b.hotel_count - a.hotel_count || (a.distance_km ?? 9999) - (b.distance_km ?? 9999))
          .slice(0, 4);
        const combined = [...bySimilarity, ...byNearby, ...byCount];
        const seen = new Set();
        const suggestions = [];
        combined.forEach((candidate) => {
          const key = areaFilterKey(candidate.area_name, candidate.recommend_city);
          if (seen.has(key)) return;
          seen.add(key);
          suggestions.push(candidate);
        });
        return suggestions.slice(0, 6);
      }

      function areaSuggestionKind(suggestion) {
        if (suggestion.similarity >= 0.55) return "相似已有片区";
        if (Number.isFinite(suggestion.distance_km)) return "附近片区";
        return "已有片区";
      }

      function areaSuggestionMeta(suggestion) {
        const parts = [];
        if (suggestion.recommend_city) parts.push(suggestion.recommend_city);
        if (suggestion.hotel_count) parts.push(`${suggestion.hotel_count} 家酒店`);
        if (Number.isFinite(suggestion.distance_km)) {
          parts.push(`距离约 ${suggestion.distance_km < 1 ? suggestion.distance_km.toFixed(1) : Math.round(suggestion.distance_km)} km`);
        }
        if (suggestion.source) parts.push(suggestion.source);
        return parts.join(" · ") || "当前结果中的已有片区";
      }

      function renderAreaCorrectionSuggestions() {
        if (!activeAreaCorrectionItem) return;
        const query = areaCorrectionInput.value;
        const suggestions = areaCorrectionSuggestions(activeAreaCorrectionItem, query);
        areaSuggestionHead.textContent = query.trim() ? "建议使用已有片区" : "附近或同城已有片区";
        areaSuggestionList.innerHTML = suggestions.length
          ? suggestions.map((suggestion) => `
              <button class="area-suggestion-btn" type="button" data-area-suggestion="${esc(suggestion.area_name)}">
                <span>
                  <span class="area-suggestion-name">${esc(suggestion.area_name)}</span>
                  <span class="area-suggestion-meta">${esc(areaSuggestionMeta(suggestion))}</span>
                </span>
                <span class="area-suggestion-tag">${esc(areaSuggestionKind(suggestion))}</span>
              </button>
            `).join("")
          : `<div class="empty">当前结果里没有可推荐的已有片区。</div>`;
      }

      function validateAreaCorrectionValue(value, currentArea) {
        const suggestedArea = simplifyChineseText(value).trim();
        if (!suggestedArea) return "请填写正确片区名。";
        if (!hasChineseText(suggestedArea) || /热门酒店片区|区域待确认/.test(suggestedArea)) {
          return "请填写具体的中文片区名称，不能使用泛化片区。";
        }
        if (normalizeSearchText(suggestedArea) === normalizeSearchText(currentArea || "")) {
          return "新片区和当前片区相同，无需提交修改。";
        }
        return "";
      }

      function editableHotelNameValue(item) {
        const currentName = displayHotelName(item);
        return hasChineseText(currentName) && !isGenericOrCityHotelName(currentName, item) ? currentName : "";
      }

      function closeAreaCorrectionDialog(value = null) {
        areaCorrectionDialog.classList.add("hidden");
        activeAreaCorrectionItem = null;
        const resolve = activeAreaCorrectionResolve;
        activeAreaCorrectionResolve = null;
        if (resolve) resolve(value);
      }

      function openAreaCorrectionDialog(item) {
        return new Promise((resolve) => {
          activeAreaCorrectionItem = item;
          activeAreaCorrectionResolve = resolve;
          const currentArea = simplifyChineseText(item.area_name || "");
          const currentName = editableHotelNameValue(item);
          const hotelName = currentName || item.hotel_name || item.hotel_original_name || "当前酒店";
          areaCorrectionHotel.textContent = `${hotelName}${currentArea ? ` · 当前片区：${currentArea}` : ""}`;
          hotelCorrectionNameInput.value = currentName;
          areaCorrectionInput.value = currentArea;
          areaCorrectionError.classList.add("hidden");
          areaCorrectionError.textContent = "";
          renderAreaCorrectionSuggestions();
          areaCorrectionDialog.classList.remove("hidden");
          window.setTimeout(() => {
            hotelCorrectionNameInput.focus();
            hotelCorrectionNameInput.select();
          }, 0);
        });
      }

      function confirmAreaCorrectionDialog() {
        if (!activeAreaCorrectionItem) return;
        const currentName = editableHotelNameValue(activeAreaCorrectionItem);
        const currentArea = simplifyChineseText(activeAreaCorrectionItem.area_name || "");
        const suggestedName = simplifyChineseText(hotelCorrectionNameInput.value).trim();
        const suggestedArea = simplifyChineseText(areaCorrectionInput.value).trim();
        const nameChanged = Boolean(suggestedName) && normalizeSearchText(suggestedName) !== normalizeSearchText(currentName || "");
        const areaChanged = Boolean(suggestedArea) && normalizeSearchText(suggestedArea) !== normalizeSearchText(currentArea || "");
        const nameValidation = nameChanged ? validateHotelNameCorrectionValue(suggestedName, currentName, activeAreaCorrectionItem) : "";
        const areaValidation = areaChanged ? validateAreaCorrectionValue(suggestedArea, currentArea) : "";
        const validation = nameValidation || areaValidation || (!nameChanged && !areaChanged ? "请至少修改酒店名或片区中的一项。" : "");
        if (validation) {
          areaCorrectionError.textContent = validation;
          areaCorrectionError.classList.remove("hidden");
          return;
        }
        closeAreaCorrectionDialog({
          suggestedName: nameChanged ? suggestedName : "",
          suggestedArea: areaChanged ? suggestedArea : "",
          currentName,
          currentArea,
        });
      }

      async function submitHotelAreaCorrectionPayload(item, suggestedArea) {
        const resp = await fetch("/api/hotel-area-corrections", {
          method: "POST",
          headers: jobHeaders(true),
          body: JSON.stringify(jobPayload({
            hotel_id: item.hotel_id || "",
            trip_hotel_id: item.trip_hotel_id || item.hotel_id || "",
            city: item.recommend_city || lastResultCity || "",
            hotel_name: displayHotelName(item) || item.hotel_name || "",
            hotel_original_name: item.hotel_original_name || "",
            current_area_name: item.area_name || "",
            suggested_area_name: suggestedArea,
            detail_url: item.detail_url || "",
          })),
        });
        await readJsonResponse(resp, "片区修改提交失败");
      }

      async function submitHotelCorrection(item) {
        if (!item || !item.hotel_id) return;
        const correction = await openAreaCorrectionDialog(item);
        if (correction === null) return;
        try {
          if (correction.suggestedName) {
            await submitHotelNameCorrectionPayload(item, correction.suggestedName, correction.currentName);
          }
          if (correction.suggestedArea) {
            await submitHotelAreaCorrectionPayload(item, correction.suggestedArea);
          }
          if (correction.suggestedName && correction.suggestedArea) {
            lastHotelNameMeta = "酒店名和片区修改已提交，审核通过后会作为固定信息使用";
            lastAreaRefreshMeta = "酒店名和片区修改已提交，审核通过后会作为固定信息使用";
          } else if (correction.suggestedName) {
            lastHotelNameMeta = "酒店名修改已提交，审核通过后会作为正确中文名使用";
          } else if (correction.suggestedArea) {
            lastAreaRefreshMeta = "片区修改已提交，审核通过后会作为正确片区使用";
          }
          errorBox.classList.add("hidden");
          scheduleRenderChoices(80);
        } catch (error) {
          errorBox.textContent = error.message || "酒店信息修改提交失败";
          errorBox.classList.remove("hidden");
        }
      }

      async function submitHotelAreaCorrection(item) {
        return submitHotelCorrection(item);
      }

      function startHotelNameRefresh(data, options = {}) {
        if (!data || !(data.choices || []).length) return;
        const requestChoices = hotelNameRefreshChoices(data, options);
        if (!requestChoices.length) return;
        const signature = hotelNameRefreshSignature(data, requestChoices);
        if (signature === lastHotelNameRefreshSignature) return;
        if (hotelNameRefreshInFlight) {
          queuedHotelNameRefreshData = { data, options };
          return;
        }
        lastHotelNameRefreshSignature = signature;
        hotelNameRefreshInFlight = true;
        const token = ++hotelNameRefreshToken;
        const batches = hotelNameRefreshBatches(requestChoices);
        let completed = 0;
        lastHotelNameMeta = `正在分批匹配简体中文酒店名 0/${requestChoices.length}...`;
        scheduleRenderChoices();
        (async () => {
          for (const batch of batches) {
            if (token !== hotelNameRefreshToken) return;
            const nameData = await runSilentJob("/api/hotel-names/start", {
              city: data.city || "",
              origin_city: data.origin_city || "",
              choices: batch,
            }, "酒店名刷新失败", options.partial ? 90000 : 180000);
            if (token !== hotelNameRefreshToken) return;
            mergeChoiceUpdates(nameData.choices || [], [
              "hotel_name",
              "hotel_original_name",
              "hotel_name_source",
              "hotel_name_simplified",
              "hotel_name_aliases",
              "hotel_search_name",
              "hotel_name_needs_refresh",
            ]);
            completed += batch.length;
            refreshLocalAreaRecommendations();
            lastHotelNameMeta = completed >= requestChoices.length
              ? "酒店名已更新为可匹配到的简体中文"
              : `正在分批匹配简体中文酒店名 ${completed}/${requestChoices.length}...`;
            scheduleRenderChoices();
          }
        })().catch(() => {
          if (token !== hotelNameRefreshToken) return;
          lastHotelNameMeta = "";
          scheduleRenderChoices();
        }).finally(() => {
          hotelNameRefreshInFlight = false;
          const queued = queuedHotelNameRefreshData;
          queuedHotelNameRefreshData = null;
          if (queued && token === hotelNameRefreshToken) {
            startHotelNameRefresh(queued.data, queued.options);
          }
        });
      }

      function renderProgressEvents(events) {
        const items = (events || []).slice(-8);
        if (!items.length) return;
        progressMeta.textContent = `${items.length} 条`;
        progressList.innerHTML = items.map((event) => {
          const percent = Number(event.percent || 0);
          const progressText = percent ? `（${percent}%）` : "";
          return `<div class="progress-item"><span><span class="stage-pill">${esc(stageLabel(event.stage))}</span>${esc(event.message)}${esc(progressText)}</span></div>`;
        }).join("");
        progressPanel.classList.remove("hidden");
      }

      function formatDuration(seconds) {
        const mm = Math.floor(seconds / 60);
        const ss = String(seconds % 60).padStart(2, "0");
        return mm ? `${mm}分${ss}秒` : `${ss}秒`;
      }

      function formatAge(seconds) {
        const value = Number(seconds || 0);
        if (value < 60) return "刚刚";
        if (value < 3600) return `${Math.floor(value / 60)}分钟前`;
        return `${Math.floor(value / 3600)}小时前`;
      }

      function formatCacheInfo(cache) {
        if (!cache) return "";
        if (cache.summary_label) return cache.summary_label;
        if (cache.hit) {
          return `缓存命中：${cache.source_label || "缓存"} ${formatAge(cache.age_seconds)}`;
        }
        return "实时查询";
      }

      function boolStatus(value) {
        if (value === true || value === 1 || value === "1") return true;
        if (value === false || value === 0 || value === "0") return false;
        if (typeof value === "string") {
          const normalized = value.trim().toLowerCase();
          if (normalized === "true" || normalized === "yes") return true;
          if (normalized === "false" || normalized === "no") return false;
        }
        return null;
      }

      function featureLabel(value, yesText, noText, unknownText) {
        const status = boolStatus(value);
        if (status === true) return yesText;
        if (status === false) return noText;
        return unknownText;
      }

      function dailyPhotoHtml(hotel, hotelName, cityName) {
        const imageUrl = hotel.image_url || hotel.hotel_image_url || "";
        if (imageUrl) {
          return `<div class="daily-photo"><img src="${esc(imageUrl)}" alt="${esc(hotelName)}" loading="lazy" decoding="async" onerror="this.parentElement.classList.add('daily-photo-empty');this.parentElement.textContent='酒店照片待更新';"></div>`;
        }
        return `<div class="daily-photo daily-photo-empty"><span>${esc(cityName || "酒店照片")}</span></div>`;
      }

      function renderDailyRecommendation(data) {
        if (!dailyContent || !dailyMeta) return;
        if (!data || !data.available) {
          dailyMeta.textContent = "等待预热缓存";
          dailyContent.innerHTML = `<div class="empty">${esc(data?.message || "暂无可用的预热缓存。")}</div>`;
          return;
        }
        const hotel = data.hotel || {};
        const hotelForName = { ...hotel, recommend_city: hotel.recommend_city || data.city || "" };
        const holiday = data.holiday || {};
        const cache = data.cache || {};
        const hotelName = displayHotelName(hotelForName) || "推荐酒店";
        const sourceLabel = hotelNameSourceLabel(hotelForName);
        const originalName = hotel.hotel_original_name && normalizeSearchText(hotel.hotel_original_name) !== normalizeSearchText(hotelName)
          ? `<div class="muted">原名：${esc(hotel.hotel_original_name)}</div>`
          : "";
        const area = simplifyChineseText(hotel.area_name || "");
        const priceDiff = Number(hotel.price_diff_nightly || 0);
        const cacheAge = cache.age_seconds === null || cache.age_seconds === undefined ? "预热缓存" : formatAge(cache.age_seconds);
        const features = [
          featureLabel(hotel.is_advanced, "高级酒店", "非高级酒店", "等级待确认"),
          featureLabel(hotel.has_pool, "有泳池", "无泳池", "泳池待确认"),
          featureLabel(hotel.has_child_facility, "有儿童设施", "无儿童设施", "儿童设施待确认"),
        ];
        dailyMeta.textContent = `${data.city || "预热城市"} · ${holiday.name || "推荐假期"} · ${cacheAge}`;
        dailyContent.innerHTML = `
          <article class="daily-hotel">
            ${dailyPhotoHtml(hotel, hotelName, data.city)}
            <div class="daily-info">
              <div class="daily-title">${esc(hotelName)}</div>
              ${originalName}
              <div class="daily-meta">
                ${data.city ? `<span class="pill">${esc(data.city)}</span>` : ""}
                ${area ? `<span class="pill">${esc(area)}</span>` : ""}
                ${hotel.room_type_label ? `<span class="pill">${esc(hotel.room_type_label)}</span>` : ""}
                ${sourceLabel ? `<span class="pill">${esc(sourceLabel)}</span>` : ""}
              </div>
              <div class="daily-feature-row">
                ${features.map((item) => `<span class="pill">${esc(item)}</span>`).join("")}
              </div>
            </div>
            <div class="daily-price-grid">
              <div class="daily-price">
                <span class="k">假期含税 / 每晚</span>
                <span class="v">${esc(hotel.holiday_avg_nightly_tax_total_price || "-")}</span>
                <span class="muted">整段含税：${esc(formatPriceText(hotel.holiday_tax_total_price) || "-")}</span>
              </div>
              <div class="daily-price">
                <span class="k">平日含税 / 每晚</span>
                <span class="v">${esc(hotel.comparison_average_nightly_tax_total_price || "-")}</span>
                <span class="muted">${esc(hotel.comparison_sample_count || 0)} 个样本，最低 ${esc(hotel.comparison_lowest_nightly_tax_total_price || "-")}</span>
              </div>
              <div class="daily-price">
                <span class="k">差额 / 每晚</span>
                <span class="v"><span class="diff ${diffClass(priceDiff)}">${esc(hotel.price_diff_nightly_text || String(priceDiff))}</span></span>
                <span class="muted">${esc(hotel.comparison_lowest_check_in || "")}${hotel.comparison_lowest_check_out ? ` 至 ${esc(hotel.comparison_lowest_check_out)}` : ""}</span>
              </div>
            </div>
            <div class="daily-action">
              ${hotel.detail_url ? `<a href="${esc(hotel.detail_url)}" target="_blank" rel="noreferrer">打开 Trip.com 详情</a>` : ""}
            </div>
          </article>
        `;
      }

      async function loadDailyRecommendation() {
        if (!dailyContent || !dailyMeta) return;
        try {
          const resp = await fetch("/api/daily-recommendation", { cache: "no-store" });
          const data = await readJsonResponse(resp, "每日推荐加载失败");
          renderDailyRecommendation(data);
        } catch (error) {
          dailyMeta.textContent = "加载失败";
          dailyContent.innerHTML = `<div class="empty">${esc(error.message || "每日推荐加载失败")}</div>`;
        }
      }

      function areaCardKey(area) {
        return areaFilterKey(
          simplifyChineseText(area.area_name || ""),
          simplifyChineseText(area.recommend_city || "")
        );
      }

      function mergeAreaLists(primaryAreas, fallbackAreas) {
        const merged = [];
        const seen = new Set();
        for (const area of [...(primaryAreas || []), ...(fallbackAreas || [])]) {
          const areaName = simplifyChineseText(area.area_name || "");
          if (!areaName || isGenericAreaName(areaName)) continue;
          const recommendCity = simplifyChineseText(area.recommend_city || "");
          const aliases = areaAliases({ ...area, area_name: areaName });
          const keys = (aliases.length ? aliases : [areaName]).map((name) => areaFilterKey(name, recommendCity));
          if (keys.some((key) => seen.has(key))) continue;
          keys.forEach((key) => seen.add(key));
          merged.push({ ...area, area_name: areaName, recommend_city: recommendCity, merged_area_names: aliases });
        }
        return sortAreaRecommendations(merged);
      }

      function refreshLocalAreaRecommendations() {
        if (!lastChoices.length) return;
        lastServerAreas = mergeAreaLists(lastServerAreas, buildAreasFromChoices(lastChoices));
      }

      function sortAreaRecommendations(areas) {
        return [...(areas || [])].sort((a, b) =>
          (Number(b.hotel_count || 0) - Number(a.hotel_count || 0)) ||
          (Number(b.lower_price_hotel_count || 0) - Number(a.lower_price_hotel_count || 0)) ||
          (Number(b.lower_price_ratio || 0) - Number(a.lower_price_ratio || 0)) ||
          (Number(a.average_price_diff_nightly || 0) - Number(b.average_price_diff_nightly || 0)) ||
          (Number(a.average_holiday_nightly_tax_total_value || 0) - Number(b.average_holiday_nightly_tax_total_value || 0))
        );
      }

      function representativeHotelsForArea(area, items) {
        const areaNames = new Set(areaAliases(area).map((name) => normalizeSearchText(name)));
        const recommendCity = normalizeSearchText(area.recommend_city || "");
        const names = [];
        const seen = new Set();
        (items || []).forEach((item) => {
          const itemArea = normalizeSearchText(item.area_name || "");
          const itemCity = normalizeSearchText(item.recommend_city || "");
          if (!areaNames.has(itemArea) || (recommendCity && itemCity !== recommendCity)) return;
          const name = simplifyChineseText(item.hotel_name || item.hotel_original_name || "");
          const key = normalizeSearchText(name);
          if (!name || seen.has(key)) return;
          seen.add(key);
          names.push(name);
        });
        if (names.length) return names;
        return (area.representative_hotels || []).map((name) => simplifyChineseText(name));
      }

      function selectedAreaMergeList() {
        return Array.from(selectedAreaMerges.values());
      }

      function selectedAreaMergeCities() {
        return new Set(selectedAreaMergeList().map((area) => normalizeSearchText(area.recommend_city || "")).filter(Boolean));
      }

      function updateAreaMergeDefaultName() {
        if (areaMergeNameTouched) return;
        const selected = selectedAreaMergeList();
        areaMergeNameInput.value = selected[0]?.area_name || "";
      }

      function updateAreaMergeBar() {
        const selected = selectedAreaMergeList();
        const count = selected.length;
        areaMergeBar.classList.toggle("hidden", count === 0);
        if (!count) {
          areaMergeMeta.textContent = "";
          areaMergeSubmit.disabled = true;
          return;
        }
        updateAreaMergeDefaultName();
        const cities = selectedAreaMergeCities();
        const hotels = selectedAreaMergeHotels();
        const sourceNames = selected.map((area) => area.area_name).join("、");
        const cityWarning = cities.size > 1 ? "，只能提交同一推荐城市的片区" : "";
        areaMergeMeta.textContent = `已选 ${count} 个片区，覆盖 ${hotels.length} 家酒店：${sourceNames}${cityWarning}`;
        areaMergeSubmit.disabled = count < 2 || cities.size > 1 || !hotels.length;
      }

      function areaMergePayloadFromCard(card) {
        let aliases = [card.dataset.areaName || ""];
        try {
          const parsed = JSON.parse(card.dataset.areaAliases || "[]");
          if (Array.isArray(parsed) && parsed.length) aliases = parsed;
        } catch {
          aliases = [card.dataset.areaName || ""];
        }
        return {
          key: card.dataset.areaKey || areaFilterKey(card.dataset.areaName || "", card.dataset.recommendCity || ""),
          area_name: card.dataset.areaName || "",
          recommend_city: card.dataset.recommendCity || "",
          aliases,
          hotel_count: Number(card.dataset.hotelCount || 0),
        };
      }

      function selectedAreaMergeHotels() {
        return hotelsForAreas(selectedAreaMergeList());
      }

      function hotelsForAreas(selected) {
        const hotels = [];
        const seen = new Set();
        selected.forEach((area) => {
          const areaNames = new Set((area.aliases || [area.area_name]).map((name) => normalizeSearchText(name)).filter(Boolean));
          const city = normalizeSearchText(area.recommend_city || "");
          lastChoices.forEach((item, index) => {
            const itemArea = normalizeSearchText(item.area_name || "");
            const itemCity = normalizeSearchText(item.recommend_city || "");
            if (!areaNames.has(itemArea) || (city && itemCity !== city)) return;
            const hotelId = String(item.hotel_id || item.trip_hotel_id || "").trim();
            if (!hotelId || seen.has(hotelId)) return;
            seen.add(hotelId);
            hotels.push({
              hotel_id: hotelId,
              trip_hotel_id: item.trip_hotel_id || hotelId,
              city: item.recommend_city || lastResultCity || "",
              hotel_name: displayHotelName(item) || item.hotel_name || "",
              hotel_original_name: item.hotel_original_name || "",
              current_area_name: item.area_name || "",
              detail_url: item.detail_url || "",
              choice_key: choiceKey(item, index),
            });
          });
        });
        return hotels;
      }

      function areaMergeSourceNames(selected) {
        const names = [];
        const seen = new Set();
        selected.forEach((area) => {
          (area.aliases || [area.area_name]).forEach((name) => {
            const value = simplifyChineseText(name || "");
            const key = normalizeSearchText(value);
            if (!value || seen.has(key)) return;
            seen.add(key);
            names.push(value);
          });
        });
        return names;
      }

      function areaOverlapsMergeSelection(area, selectedKeys) {
        const recommendCity = simplifyChineseText(area.recommend_city || "");
        return areaAliases(area).some((name) => {
          const key = areaFilterKey(name, recommendCity);
          if (selectedKeys.has(key)) return true;
          const areaToken = `${normalizeSearchText(name)}::`;
          return Array.from(selectedKeys).some((item) => String(item).startsWith(areaToken));
        });
      }

      function correctionCreatedValue(correction) {
        const value = Date.parse(correction?.created_at || correction?.updated_at || "");
        return Number.isFinite(value) ? value : 0;
      }

      function correctionCity(correction) {
        return simplifyChineseText(correction?.city_name_zh || correction?.city || "");
      }

      function correctionSuggestedArea(correction) {
        return simplifyChineseText(correction?.suggested_area_name_zh || correction?.suggested_area_name || "");
      }

      function correctionSourceAreas(correction) {
        return Array.isArray(correction?.source_areas) ? correction.source_areas : [];
      }

      function correctionHotels(correction) {
        return Array.isArray(correction?.hotels) ? correction.hotels : [];
      }

      function correctionSourceNames(correction) {
        const names = [];
        const seen = new Set();
        const append = (name) => {
          const value = simplifyChineseText(name || "");
          const key = normalizeSearchText(value);
          if (!value || seen.has(key)) return;
          seen.add(key);
          names.push(value);
        };
        correctionSourceAreas(correction).forEach((area) => {
          append(area.area_name);
          (Array.isArray(area.aliases) ? area.aliases : []).forEach(append);
        });
        (Array.isArray(correction?.source_area_names) ? correction.source_area_names : []).forEach(append);
        return names;
      }

      function correctionSourceKeys(correction) {
        const keys = new Set();
        const fallbackCity = correctionCity(correction);
        correctionSourceAreas(correction).forEach((area) => {
          const areaCity = simplifyChineseText(area.recommend_city || fallbackCity);
          const names = [area.area_name, ...(Array.isArray(area.aliases) ? area.aliases : [])];
          names.forEach((name) => {
            const value = simplifyChineseText(name || "");
            if (value) keys.add(areaFilterKey(value, areaCity));
          });
        });
        correctionSourceNames(correction).forEach((name) => keys.add(areaFilterKey(name, fallbackCity)));
        return keys;
      }

      function correctionHotelIds(correction) {
        const ids = new Set();
        correctionHotels(correction).forEach((hotel) => {
          const id = String(hotel.hotel_id || hotel.trip_hotel_id || "").trim();
          if (id) ids.add(id);
        });
        return ids;
      }

      function correctionOperation(correction) {
        const explicit = String(correction?.operation_type || correction?.operation || "").trim();
        if (explicit) return explicit;
        return correctionSourceAreas(correction).length <= 1 ? "rename" : "merge";
      }

      function sortedAreaMergeCorrections(corrections) {
        return [...(corrections || [])].sort((a, b) =>
          Number(b?.id || 0) - Number(a?.id || 0) ||
          correctionCreatedValue(b) - correctionCreatedValue(a)
        );
      }

      function buildAreaMergeCorrectionRecord(suggestedArea, selected, hotels, submitData) {
        const correction = submitData?.correction || submitData || {};
        return {
          id: correction.id || "",
          status: correction.status || "pending",
          city_name_zh: selected[0]?.recommend_city || lastResultCity || "",
          suggested_area_name_zh: suggestedArea,
          source_areas: selected.map((area) => ({
            area_name: area.area_name,
            recommend_city: area.recommend_city,
            aliases: area.aliases || [area.area_name],
            hotel_count: area.hotel_count || 0,
          })),
          source_area_names: areaMergeSourceNames(selected),
          hotels,
          hotel_count: (hotels || []).length,
          created_at: new Date().toISOString(),
        };
      }

      function upsertActiveAreaMergeCorrection(record) {
        if (!record || !correctionSuggestedArea(record)) return;
        const id = String(record.id || "");
        activeAreaMergeCorrections = activeAreaMergeCorrections.filter((item) => {
          if (id && String(item.id || "") === id) return false;
          return !(
            normalizeSearchText(correctionSuggestedArea(item)) === normalizeSearchText(correctionSuggestedArea(record)) &&
            normalizeSearchText(correctionCity(item)) === normalizeSearchText(correctionCity(record)) &&
            JSON.stringify([...correctionSourceKeys(item)].sort()) === JSON.stringify([...correctionSourceKeys(record)].sort())
          );
        });
        activeAreaMergeCorrections.unshift(record);
        activeAreaMergeCorrections = sortedAreaMergeCorrections(activeAreaMergeCorrections);
        rebuildPendingAreaMergeMarkers();
      }

      function rebuildPendingAreaMergeMarkers() {
        pendingAreaMergeAreaKeys = new Map();
        activeAreaMergeCorrections.forEach((correction) => {
          const suggestedArea = correctionSuggestedArea(correction);
          const city = correctionCity(correction);
          if (!suggestedArea) return;
          const sourceNames = correctionSourceNames(correction);
          const baseInfo = {
            suggestedArea,
            sourceNames,
            hotelCount: Number(correction.hotel_count || correctionHotels(correction).length || 0),
            correctionId: correction.id || "",
            status: correction.status || "pending",
            operation: correctionOperation(correction),
          };
          correctionSourceKeys(correction).forEach((key) => {
            if (!pendingAreaMergeAreaKeys.has(key)) pendingAreaMergeAreaKeys.set(key, { ...baseInfo, role: "source" });
          });
          const targetKey = areaFilterKey(suggestedArea, city);
          if (!pendingAreaMergeAreaKeys.has(targetKey)) {
            pendingAreaMergeAreaKeys.set(targetKey, { ...baseInfo, role: "target" });
          }
        });
      }

      function pendingAreaMergeInfoForArea(area) {
        const recommendCity = simplifyChineseText(area.recommend_city || "");
        const names = areaAliases(area);
        for (const name of names) {
          const info = pendingAreaMergeAreaKeys.get(areaFilterKey(name, recommendCity)) ||
            Array.from(pendingAreaMergeAreaKeys.entries()).find(([key]) => String(key).startsWith(`${normalizeSearchText(name)}::`))?.[1];
          if (info && info.status !== "approved") return info;
        }
        return null;
      }

      function pendingAreaMergeLabel(info) {
        if (!info) return "";
        if (info.operation === "rename") {
          if (info.role === "source") return `已提交改名为「${info.suggestedArea}」待审核`;
          return "改名待审核";
        }
        if (info.role === "source") return `已提交合并到「${info.suggestedArea}」待审核`;
        return "合并待审核";
      }

      function pendingAreaMergeNote(info) {
        if (!info) return "";
        const sourceText = (info.sourceNames || []).length ? info.sourceNames.join("、") : "已选片区";
        const idText = info.correctionId ? ` #${info.correctionId}` : "";
        if (info.operation === "rename") {
          return `已操作改名${idText}：${sourceText} → ${info.suggestedArea}，等待后台审核，请勿重复提交。`;
        }
        return `已操作合并${idText}：${sourceText} → ${info.suggestedArea}，等待后台审核，请勿重复提交。`;
      }

      function markPendingAreaMerge(suggestedArea, selected, hotels, submitData) {
        upsertActiveAreaMergeCorrection(buildAreaMergeCorrectionRecord(suggestedArea, selected, hotels, submitData));
      }

      function applyPendingAreaMergePreview(suggestedArea, selected, hotels) {
        return applyActiveAreaMergeCorrections();
      }

      function applyActiveAreaMergeCorrections() {
        if (!activeAreaMergeCorrections.length || !lastChoices.length) return false;
        rebuildPendingAreaMergeMarkers();
        const rules = sortedAreaMergeCorrections(activeAreaMergeCorrections).map((correction) => ({
          correction,
          suggestedArea: correctionSuggestedArea(correction),
          city: correctionCity(correction),
          status: correction.status || "pending",
          sourceNames: correctionSourceNames(correction),
          sourceKeys: correctionSourceKeys(correction),
          hotelIds: correctionHotelIds(correction),
          operation: correctionOperation(correction),
        })).filter((rule) => rule.suggestedArea && (rule.sourceKeys.size || rule.hotelIds.size));
        let changed = false;
        const claimedChoices = new Set();
        lastChoices = lastChoices.map((item, index) => {
          const key = choiceKey(item, index);
          if (claimedChoices.has(key)) return item;
          const itemAreaKey = areaFilterKey(item.area_name || "", item.recommend_city || "");
          const hotelId = String(item.hotel_id || item.trip_hotel_id || "").trim();
          const rule = rules.find((candidate) =>
            (hotelId && candidate.hotelIds.has(hotelId)) ||
            candidate.sourceKeys.has(itemAreaKey) ||
            candidate.sourceKeys.has(areaFilterKey(item.area_name || "", candidate.city))
          );
          if (!rule) return item;
          claimedChoices.add(key);
          changed = true;
          return {
            ...item,
            area_name: rule.suggestedArea,
            area_source: rule.status === "approved" ? "人工审核片区" : (rule.operation === "rename" ? "待审核片区改名" : "待审核合并片区"),
            area_hint: rule.sourceNames.length ? `${rule.operation === "rename" ? "片区改名" : "片区合并"}：${rule.sourceNames.join("、")}` : item.area_hint,
            _pending_area_merge: rule.status !== "approved",
          };
        });

        const sourceKeysToRemove = new Set();
        rules.forEach((rule) => rule.sourceKeys.forEach((key) => sourceKeysToRemove.add(key)));
        const builtAreas = buildAreasFromChoices(lastChoices);
        const targetAreas = [];
        rules.forEach((rule) => {
          const targetCity = rule.city || lastResultCity || "";
          const targetKey = areaFilterKey(rule.suggestedArea, targetCity);
          const mergedArea = builtAreas.find((area) => areaFilterKey(area.area_name, area.recommend_city) === targetKey);
          if (!mergedArea) return;
          mergedArea.merged_area_names = rule.sourceNames.length ? rule.sourceNames : [rule.suggestedArea];
          mergedArea.reason = `${rule.status === "approved" ? "已审核" : "待审核"}${rule.operation === "rename" ? "改名" : "合并"}：${(rule.sourceNames || []).join("、")} 已归并到该片区。`;
          targetAreas.push(mergedArea);
        });
        if (targetAreas.length || sourceKeysToRemove.size) {
          lastServerAreas = mergeAreaLists(
            targetAreas,
            (lastServerAreas || []).filter((area) => !areaOverlapsMergeSelection(area, sourceKeysToRemove))
          );
        }
        return changed || Boolean(targetAreas.length);
      }

      function areaMergeCitiesFromResult(data) {
        const cities = [];
        const append = (value) => {
          const city = simplifyChineseText(value || "");
          if (city && !cities.includes(city)) cities.push(city);
        };
        append(data?.city);
        append(data?.origin_city);
        (data?.nearby_cities || []).forEach(append);
        (data?.city_results || []).forEach((item) => append(item.city));
        (data?.choices || []).forEach((item) => append(item.recommend_city));
        lastChoices.forEach((item) => append(item.recommend_city));
        return cities.filter((city) => !city.endsWith("周边"));
      }

      async function loadActiveAreaMergeCorrections(data) {
        const cities = areaMergeCitiesFromResult(data);
        if (!cities.length) return;
        const token = ++areaMergeCorrectionToken;
        const params = new URLSearchParams();
        cities.forEach((city) => params.append("city", city));
        try {
          const resp = await fetch(`/api/area-merge-corrections/active?${params.toString()}`, {
            cache: "no-store",
            headers: jobHeaders(),
          });
          const payload = await readJsonResponse(resp, "合并片区记录加载失败");
          if (token !== areaMergeCorrectionToken) return;
          activeAreaMergeCorrections = sortedAreaMergeCorrections(payload.corrections || []);
          rebuildPendingAreaMergeMarkers();
          if (applyActiveAreaMergeCorrections()) {
            lastAreaRefreshMeta = lastAreaRefreshMeta || "已应用待审核/已审核片区合并记录";
            scheduleRenderChoices(20);
          } else {
            renderAreas(visibleChoices({ ignoreAreaFilter: true }));
          }
        } catch {
          if (token !== areaMergeCorrectionToken) return;
        }
      }

      function clearAreaMergeSelection() {
        selectedAreaMerges = new Map();
        areaMergeNameTouched = false;
        areaMergeNameInput.value = "";
        renderAreas(visibleChoices({ ignoreAreaFilter: true }));
      }

      function toggleAreaMergeSelection(card, checked) {
        if (card.dataset.areaMergePending === "1") return;
        const area = areaMergePayloadFromCard(card);
        if (!area.key || !area.area_name) return;
        if (checked) {
          selectedAreaMerges.set(area.key, area);
        } else {
          selectedAreaMerges.delete(area.key);
        }
        updateAreaMergeBar();
        card.classList.toggle("merge-selected", checked);
      }

      async function submitAreaMergeCorrection() {
        const selected = selectedAreaMergeList();
        if (selected.length < 2) return;
        const cities = selectedAreaMergeCities();
        if (cities.size > 1) {
          errorBox.textContent = "只能合并同一个推荐城市下的片区。";
          errorBox.classList.remove("hidden");
          return;
        }
        const suggestedArea = simplifyChineseText(areaMergeNameInput.value).trim();
        if (!suggestedArea || !hasChineseText(suggestedArea) || isGenericAreaName(suggestedArea)) {
          errorBox.textContent = "请填写具体的中文片区名称，不能使用泛化片区。";
          errorBox.classList.remove("hidden");
          return;
        }
        const hotels = selectedAreaMergeHotels();
        if (!hotels.length) {
          errorBox.textContent = "选中的片区里没有可固定的酒店。";
          errorBox.classList.remove("hidden");
          return;
        }
        areaMergeSubmit.disabled = true;
        try {
          const resp = await fetch("/api/area-merge-corrections", {
            method: "POST",
            headers: jobHeaders(true),
            body: JSON.stringify(jobPayload({
              city: selected[0]?.recommend_city || lastResultCity || "",
              suggested_area_name: suggestedArea,
              source_areas: selected.map((area) => ({
                area_name: area.area_name,
                recommend_city: area.recommend_city,
                aliases: area.aliases || [area.area_name],
                hotel_count: area.hotel_count || 0,
              })),
              hotels,
            })),
          });
          const submitData = await readJsonResponse(resp, "合并片区提交失败");
          markPendingAreaMerge(suggestedArea, selected, hotels, submitData);
          const previewApplied = applyPendingAreaMergePreview(suggestedArea, selected, hotels);
          lastAreaRefreshMeta = previewApplied
            ? `合并片区申请已提交，当前页已临时预览「${suggestedArea}」，审核通过后 ${hotels.length} 家酒店会固定到该片区`
            : `合并片区申请已提交，审核通过后 ${hotels.length} 家酒店会固定为「${suggestedArea}」`;
          errorBox.classList.add("hidden");
          clearAreaMergeSelection();
          scheduleRenderChoices(80);
        } catch (error) {
          errorBox.textContent = error.message || "合并片区提交失败";
          errorBox.classList.remove("hidden");
          updateAreaMergeBar();
        }
      }

      async function submitAreaRenameCorrection(card) {
        if (!card || card.dataset.areaMergePending === "1") return;
        const area = areaMergePayloadFromCard(card);
        if (!area.key || !area.area_name) return;
        const suggestedArea = simplifyChineseText(window.prompt("新的片区名称", area.area_name) || "").trim();
        if (!suggestedArea) return;
        if (!hasChineseText(suggestedArea) || isGenericAreaName(suggestedArea)) {
          errorBox.textContent = "请填写具体的中文片区名称，不能使用泛化片区。";
          errorBox.classList.remove("hidden");
          return;
        }
        if (normalizeSearchText(suggestedArea) === normalizeSearchText(area.area_name)) {
          errorBox.textContent = "新的片区名称不能和原片区相同。";
          errorBox.classList.remove("hidden");
          return;
        }
        const hotels = hotelsForAreas([area]);
        if (!hotels.length) {
          errorBox.textContent = "该片区里没有可固定的酒店。";
          errorBox.classList.remove("hidden");
          return;
        }
        const button = card.querySelector("[data-area-rename]");
        if (button) button.disabled = true;
        try {
          const resp = await fetch("/api/area-merge-corrections", {
            method: "POST",
            headers: jobHeaders(true),
            body: JSON.stringify(jobPayload({
              city: area.recommend_city || lastResultCity || "",
              suggested_area_name: suggestedArea,
              source_areas: [{
                area_name: area.area_name,
                recommend_city: area.recommend_city,
                aliases: area.aliases || [area.area_name],
                hotel_count: area.hotel_count || 0,
              }],
              hotels,
            })),
          });
          const submitData = await readJsonResponse(resp, "片区改名提交失败");
          markPendingAreaMerge(suggestedArea, [area], hotels, submitData);
          const previewApplied = applyPendingAreaMergePreview(suggestedArea, [area], hotels);
          lastAreaRefreshMeta = previewApplied
            ? `片区改名申请已提交，当前页已临时预览「${suggestedArea}」，审核通过后 ${hotels.length} 家酒店会固定到该片区`
            : `片区改名申请已提交，审核通过后 ${hotels.length} 家酒店会固定为「${suggestedArea}」`;
          errorBox.classList.add("hidden");
          scheduleRenderChoices(80);
        } catch (error) {
          errorBox.textContent = error.message || "片区改名提交失败";
          errorBox.classList.remove("hidden");
          if (button) button.disabled = false;
        }
      }

      function renderAreas(items) {
        const builtAreas = buildAreasFromChoices(items);
        const areas = activeView === "all" && !resultSearchQuery && lastServerAreas.length
          ? mergeAreaLists(lastServerAreas, builtAreas)
          : builtAreas;
        updateFloatingNavCounts({ areaCount: areas.length });
        areaMeta.textContent = activeAreaFilter
          ? `已筛选 ${activeAreaFilter.label}，再次点击该片区可取消`
          : (lastAreaRefreshMeta || (areas.length
            ? `已显示 ${areas.length} 个推荐片区，可在区域框内滚动查看`
            : "暂无可推荐片区"));
        if (!areas.length) {
          areaRecommendations.innerHTML = `<div class="empty">当前条件下暂无推荐旅游区域。</div>`;
          updateAreaMergeBar();
          return;
        }
        const areaCards = areas.map((area) => {
            const areaName = simplifyChineseText(area.area_name || "");
            const recommendCity = simplifyChineseText(area.recommend_city || "");
            const reason = simplifyChineseText(area.reason || "");
            const representativeHotels = representativeHotelsForArea(area, items);
            const key = areaFilterKey(areaName, recommendCity);
            const active = activeAreaFilter && key === activeAreaFilter.key;
            const cityLabel = recommendCity ? `${recommendCity} · ` : "";
            const mergedAreaNames = areaAliases(area);
            const mergedCount = Math.max(0, mergedAreaNames.length - 1);
            const pendingMerge = pendingAreaMergeInfoForArea(area);
            const mergeSelected = !pendingMerge && selectedAreaMerges.has(key);
            const pendingLabel = pendingAreaMergeLabel(pendingMerge);
            const pendingNote = pendingAreaMergeNote(pendingMerge);
            const mergeControlText = pendingMerge ? "已操作，等待审核" : "合并片区";
            return `
            <article class="area-card${active ? " active" : ""}${mergeSelected ? " merge-selected" : ""}${pendingMerge ? " merge-pending" : ""}" role="button" tabindex="0" data-area-key="${esc(key)}" data-area-name="${esc(areaName)}" data-area-aliases="${esc(JSON.stringify(mergedAreaNames))}" data-recommend-city="${esc(recommendCity)}" data-hotel-count="${esc(area.hotel_count)}" data-area-merge-pending="${pendingMerge ? "1" : "0"}" aria-pressed="${active ? "true" : "false"}" title="查看该片区酒店">
              <div class="area-name">${esc(areaName)}</div>
              <div class="area-stats">
                ${recommendCity ? `<span class="pill">${esc(recommendCity)}</span>` : ""}
                <span class="pill">${esc(area.hotel_count)} 家酒店</span>
                <span class="pill">${esc(area.lower_price_hotel_count)} 家更低</span>
                ${mergedCount ? `<span class="pill">合并 ${esc(mergedCount + 1)} 个片区</span>` : ""}
                ${pendingMerge ? `<span class="pill area-merge-status">${esc(pendingLabel)}</span>` : ""}
                <span class="pill">${esc(area.average_holiday_nightly_tax_total_price)}/晚</span>
                <span class="diff ${diffClass(area.average_price_diff_nightly)}">${esc(area.average_price_diff_nightly_text)}</span>
              </div>
              <div class="area-hotels">${esc(reason)}</div>
              <div class="area-hotels">${esc(cityLabel)}${esc(representativeHotels.slice(0, 3).join("、"))}</div>
              ${pendingMerge ? `<div class="area-merge-note">${esc(pendingNote)}</div>` : ""}
              <div class="area-card-actions" data-area-merge-control>
                <button class="area-rename-link" type="button" data-area-rename ${pendingMerge ? "disabled" : ""} aria-label="修改片区名称" title="修改片区名称">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                  </svg>
                </button>
              </div>
              <label class="area-select${pendingMerge ? " disabled" : ""}" data-area-merge-control aria-disabled="${pendingMerge ? "true" : "false"}">
                <input type="checkbox" data-area-merge-checkbox ${mergeSelected ? "checked" : ""} ${pendingMerge ? "disabled" : ""} />
                <span>${esc(mergeControlText)}</span>
              </label>
            </article>
          `;
          });
        areaRecommendations.innerHTML = areaCards.join("");
        updateAreaMergeBar();
      }

      function buildAreasFromChoices(items) {
        const groups = new Map();
        for (const item of items) {
          const name = item.area_name || "";
          if (!name || isGenericAreaName(name)) continue;
          const areaName = simplifyChineseText(name);
          const recommendCity = simplifyChineseText(item.recommend_city || "");
          const key = areaFilterKey(areaName, recommendCity);
          if (!groups.has(key)) {
            groups.set(key, {
              area_name: areaName,
              recommend_city: recommendCity,
              hotel_count: 0,
              lower_price_hotel_count: 0,
              slightly_higher_hotel_count: 0,
              holiday_values: [],
              diff_values: [],
              representative_hotels: [],
            });
          }
          const group = groups.get(key);
          const diff = Number(item.price_diff_nightly || 0);
          group.hotel_count += 1;
          if (diff <= 0) group.lower_price_hotel_count += 1;
          else group.slightly_higher_hotel_count += 1;
          group.holiday_values.push(Number(item.holiday_avg_nightly_tax_total_value || 0));
          group.diff_values.push(diff);
          if (group.representative_hotels.length < 4) {
            group.representative_hotels.push(item.hotel_name || item.hotel_original_name || "");
          }
        }
        let areas = Array.from(groups.values()).map((group) => {
          const avgHoliday = Math.round(group.holiday_values.reduce((sum, value) => sum + value, 0) / Math.max(1, group.holiday_values.length));
          const avgDiff = Math.round(group.diff_values.reduce((sum, value) => sum + value, 0) / Math.max(1, group.diff_values.length));
          return {
            ...group,
            lower_price_ratio: group.lower_price_hotel_count / Math.max(1, group.hotel_count),
            average_holiday_nightly_tax_total_value: avgHoliday,
            average_holiday_nightly_tax_total_price: `CNY ${avgHoliday}`,
            average_price_diff_nightly: avgDiff,
            average_price_diff_nightly_text: avgDiff > 0 ? `+CNY ${avgDiff}` : `CNY ${avgDiff}`,
            reason: areaReason(group.hotel_count, group.lower_price_hotel_count, avgDiff),
          };
        });
        return sortAreaRecommendations(areas);
      }

      function isGenericAreaName(name) {
        return String(name || "").includes("热门酒店片区") || String(name || "").includes("区域待确认");
      }

      function areaReason(hotelCount, lowerCount) {
        if (lowerCount === hotelCount) return `${hotelCount} 家命中酒店假期价格不高于平日代表均价。`;
        if (lowerCount) return `${lowerCount} 家酒店假期更低，整体涨幅可控。`;
        return `${hotelCount} 家酒店假期涨幅不超过 100 元/晚。`;
      }

      function selectAreaCard(card) {
        const areaName = card.dataset.areaName || "";
        const recommendCity = card.dataset.recommendCity || "";
        const key = card.dataset.areaKey || areaFilterKey(areaName, recommendCity);
        if (activeAreaFilter && activeAreaFilter.key === key) {
          activeAreaFilter = null;
        } else {
          let aliases = [areaName];
          try {
            const parsed = JSON.parse(card.dataset.areaAliases || "[]");
            if (Array.isArray(parsed) && parsed.length) aliases = parsed;
          } catch {
            aliases = [areaName];
          }
          activeAreaFilter = {
            key,
            area: normalizeSearchText(areaName),
            areas: new Set(aliases.map((name) => normalizeSearchText(name)).filter(Boolean)),
            city: normalizeSearchText(recommendCity),
            label: recommendCity ? `${recommendCity} · ${areaName}` : areaName,
          };
        }
        renderChoices();
        choicesBody.closest(".panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function readJsonResponse(resp, fallbackMessage) {
        const contentType = resp.headers.get("content-type") || "";
        const text = await resp.text();
        const trimmed = text.trim();
        const looksJson = contentType.includes("application/json") || trimmed.startsWith("{") || trimmed.startsWith("[");
        let data = null;
        if (looksJson) {
          try {
            data = trimmed ? JSON.parse(trimmed) : {};
          } catch (error) {
            throw new Error(`${fallbackMessage}：服务返回格式异常，请稍后重试。`);
          }
        } else {
          if ([502, 503, 504, 522, 524].includes(resp.status)) {
            throw new Error(`${fallbackMessage}：查询时间较长，公网隧道返回超时，请稍后重试或缩小条件。`);
          }
          const plain = trimmed.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 120);
          throw new Error(`${fallbackMessage}：服务返回异常${resp.status ? `（${resp.status}）` : ""}${plain ? `，${plain}` : ""}`);
        }
        if (!resp.ok) {
          throw new Error(data.error || `${fallbackMessage}（${resp.status}）`);
        }
        return data;
      }

      function sleep(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function partialResultKey(partial, data) {
        const choices = partial.choices || [];
        const identity = choices
          .slice(0, 12)
          .map((item) => `${item.hotel_id || ""}:${item.room_type || ""}:${item.price_diff_nightly || ""}`)
          .join("|");
        return [
          partial.partial?.stage || data.progress?.stage || "",
          partial.partial?.total_choice_count || "",
          partial.partial?.displayed_choice_count || "",
          partial.partial?.scanned_hotel_limit || "",
          choices.length,
          (partial.city_results || []).length,
          partial.cache?.summary_label || "",
          identity,
        ].join(":");
      }

      async function runAsyncJob(startUrl, payload, fallbackMessage, options = {}) {
        let partialKey = "";
        let jobResultState = null;
        const startResp = await fetch(startUrl, {
          method: "POST",
          headers: jobHeaders(true),
          body: JSON.stringify(jobPayload(payload)),
        });
        const startData = await readJsonResponse(startResp, fallbackMessage);
        if (startData.progress_events) {
          renderProgressEvents(startData.progress_events);
        }
        if (startData.progress && startData.progress.message) {
          const percent = Number(startData.progress.percent || 0);
          lastProgressMessage = percent ? `${startData.progress.message}（${percent}%）` : startData.progress.message;
          statusText.textContent = lastProgressMessage;
        }
        if (startData.status === "succeeded" && startData.result) {
          return startData.result;
        }
        let jobVersion = Number(startData.version || 0);
        if (startData.result) {
          jobResultState = startData.result;
        }
        if (startData.partial_result && typeof options.onProgress === "function") {
          jobResultState = startData.partial_result;
          partialKey = partialResultKey(startData.partial_result, startData);
          options.onProgress(startData.partial_result, startData);
        }
        const pollUrl = startData.poll_url || `/api/jobs/${startData.job_id}`;
        let pollInterval = Number(startData.poll_interval_ms || 2000);
        if (!pollUrl || !startData.job_id) {
          throw new Error(`${fallbackMessage}：查询任务创建失败。`);
        }

        const maxWaitMs = 30 * 60 * 1000;
        const started = Date.now();
        while (Date.now() - started < maxWaitMs) {
          await sleep(pollInterval);
          const resp = await fetch(pollUrlWithVersion(pollUrl, jobVersion), { cache: "no-store", headers: jobHeaders() });
          const data = await readJsonResponse(resp, fallbackMessage);
          if (data.version !== undefined) {
            jobVersion = Number(data.version || jobVersion);
          }
          if (data.progress && data.progress.message) {
            const percent = Number(data.progress.percent || 0);
            lastProgressMessage = percent ? `${data.progress.message}（${percent}%）` : data.progress.message;
            statusText.textContent = lastProgressMessage;
          }
          if (data.progress_events) {
            renderProgressEvents(data.progress_events);
          }
          if (data.partial_result_delta) {
            jobResultState = mergeResultDelta(jobResultState, data.partial_result_delta);
            if (jobResultState && typeof options.onProgress === "function") {
              const key = partialResultKey(jobResultState, data);
              if (key !== partialKey) {
                partialKey = key;
                options.onProgress(jobResultState, data);
              }
            }
          }
          if (data.partial_result && typeof options.onProgress === "function") {
            const partial = data.partial_result;
            jobResultState = partial;
            const key = partialResultKey(partial, data);
            if (key !== partialKey) {
              partialKey = key;
              options.onProgress(partial, data);
            }
          }
          if (data.result_delta) {
            jobResultState = mergeResultDelta(jobResultState, data.result_delta);
          }
          if (data.result) {
            jobResultState = data.result;
          }
          if (data.status === "succeeded") {
            return data.result || jobResultState;
          }
          if (data.status === "failed") {
            throw new Error(data.error || fallbackMessage);
          }
          pollInterval = Math.min(5000, Math.max(1500, pollInterval));
        }
        throw new Error(`${fallbackMessage}：查询超过 30 分钟仍未完成，请稍后重试。`);
      }

      async function runSilentJob(startUrl, payload, fallbackMessage, maxWaitMs = 180000) {
        const startResp = await fetch(startUrl, {
          method: "POST",
          headers: jobHeaders(true),
          body: JSON.stringify(jobPayload(payload)),
        });
        const startData = await readJsonResponse(startResp, fallbackMessage);
        if (startData.status === "succeeded" && startData.result) {
          return startData.result;
        }
        const pollUrl = startData.poll_url || `/api/jobs/${startData.job_id}`;
        let jobVersion = Number(startData.version || 0);
        let jobResultState = startData.result || startData.partial_result || null;
        const started = Date.now();
        while (Date.now() - started < maxWaitMs) {
          await sleep(1800);
          const resp = await fetch(pollUrlWithVersion(pollUrl, jobVersion), { cache: "no-store", headers: jobHeaders() });
          const data = await readJsonResponse(resp, fallbackMessage);
          if (data.version !== undefined) {
            jobVersion = Number(data.version || jobVersion);
          }
          if (data.partial_result_delta) jobResultState = mergeResultDelta(jobResultState, data.partial_result_delta);
          if (data.partial_result) jobResultState = data.partial_result;
          if (data.result_delta) jobResultState = mergeResultDelta(jobResultState, data.result_delta);
          if (data.result) jobResultState = data.result;
          if (data.status === "succeeded") return data.result || jobResultState;
          if (data.status === "failed") throw new Error(data.error || fallbackMessage);
        }
        throw new Error(`${fallbackMessage}：后台任务暂未完成。`);
      }

      async function loadHolidays() {
        const resp = await fetch("/api/holidays");
        const data = await readJsonResponse(resp, "假期列表加载失败");
        holidaySelect.innerHTML = data.holidays
          .map((item) => `<option value="${esc(item.code)}">${esc(item.label)}</option>`)
          .join("");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.add("hidden");
        result.classList.add("hidden");
        areaRefreshToken += 1;
        hotelNameRefreshToken += 1;
        hotelNameRefreshInFlight = false;
        queuedHotelNameRefreshData = null;
        lastHotelNameRefreshSignature = "";
        coverageRefreshToken += 1;
        lastAreaRefreshMeta = "";
        lastResultMeta = "";
        lastHotelNameMeta = "";
        lastResultStage = "";
        const payload = Object.fromEntries(new FormData(form).entries());
        currentRequestKind = "single";
        currentUseCache = useCacheInput.checked;
        payload.use_cache = currentUseCache ? "true" : "false";
        payload.cache_only = "false";
        setLoading(true);

        try {
          resetViewMode();
          const data = await runAsyncJob("/api/search/start", payload, "查询失败", {
            onProgress: (partial) => applyResultData(partial, { refreshAreas: false, refreshHotelNames: true, refreshCoverage: false }),
          });
          applyResultData(data);
        } catch (error) {
          errorBox.textContent = error.message || "查询失败";
          errorBox.classList.remove("hidden");
        } finally {
          setLoading(false);
        }
      });

      nearbyForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.add("hidden");
        result.classList.add("hidden");
        areaRefreshToken += 1;
        hotelNameRefreshToken += 1;
        hotelNameRefreshInFlight = false;
        queuedHotelNameRefreshData = null;
        lastHotelNameRefreshSignature = "";
        coverageRefreshToken += 1;
        lastAreaRefreshMeta = "";
        lastResultMeta = "";
        lastHotelNameMeta = "";
        lastResultStage = "";
        const basePayload = Object.fromEntries(new FormData(form).entries());
        delete basePayload.city;
        const payload = { ...basePayload, ...Object.fromEntries(new FormData(nearbyForm).entries()) };
        payload.origin_city = originCity.value;
        payload.nearby_limit = "4";
        currentRequestKind = "nearby";
        currentUseCache = useCacheInput.checked;
        payload.use_cache = currentUseCache ? "true" : "false";
        payload.cache_only = "false";
        setLoading(true);

        try {
          resetViewMode();
          const data = await runAsyncJob("/api/nearby-search/start", payload, "附近推荐失败", {
            onProgress: (partial) => applyResultData(partial, { refreshAreas: false, refreshHotelNames: true, refreshCoverage: false }),
          });
          applyResultData(data);
        } catch (error) {
          errorBox.textContent = error.message || "附近推荐失败";
          errorBox.classList.remove("hidden");
        } finally {
          setLoading(false);
        }
      });

      geoBtn.addEventListener("click", () => {
        errorBox.classList.add("hidden");
        if (!navigator.geolocation) {
          errorBox.textContent = "当前浏览器不支持读取位置，请手动选择所在城市。";
          errorBox.classList.remove("hidden");
          return;
        }
        geoBtn.disabled = true;
        nearbyHint.textContent = "正在读取当前位置...";
        navigator.geolocation.getCurrentPosition(async (position) => {
          try {
            const resp = await fetch("/api/resolve-location", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                lat: position.coords.latitude,
                lon: position.coords.longitude,
              }),
            });
            const data = await readJsonResponse(resp, "定位失败");
            setOriginCity(data.city);
            nearbyHint.textContent = `已按当前位置识别为 ${data.city}，可点击“搜索周边城市”。`;
          } catch (error) {
            errorBox.textContent = error.message || "定位失败，请手动选择所在城市。";
            errorBox.classList.remove("hidden");
            nearbyHint.textContent = "定位失败，可手动选择所在城市。";
          } finally {
            geoBtn.disabled = false;
          }
        }, () => {
          geoBtn.disabled = false;
          nearbyHint.textContent = "无法读取位置，可手动选择所在城市。";
          errorBox.textContent = "浏览器没有授权当前位置，请手动选择所在城市。";
          errorBox.classList.remove("hidden");
        }, { timeout: 8000, maximumAge: 10 * 60 * 1000 });
      });

      initOriginCitySelector();

      loadHolidays().catch((error) => {
        errorBox.textContent = error.message || "假期列表加载失败";
        errorBox.classList.remove("hidden");
      });

      loadDailyRecommendation();

      priceButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const [min, max] = button.dataset.priceRange.split("-");
          form.elements.min_price.value = min || "";
          form.elements.max_price.value = max || "";
          priceButtons.forEach((item) => item.classList.toggle("active", item === button));
        });
      });

      viewFilter.addEventListener("click", (event) => {
        const button = event.target.closest("[data-view]");
        if (!button) return;
        activeView = button.dataset.view;
        viewFilter.querySelectorAll("[data-view]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        renderChoices();
      });

      resultSortSelect.addEventListener("change", () => {
        resultSortMode = resultSortSelect.value || "default";
        renderChoices();
      });

      function syncResultPriceFilters() {
        resultMinPriceFilter = normalizedPriceFilterValue(resultMinPriceInput.value);
        resultMaxPriceFilter = normalizedPriceFilterValue(resultMaxPriceInput.value);
      }

      [resultMinPriceInput, resultMaxPriceInput].forEach((input) => {
        input.addEventListener("input", () => {
          syncResultPriceFilters();
          scheduleRenderChoices(80);
        });
      });

      resultFilterClear.addEventListener("click", () => {
        resultSortSelect.value = "default";
        resultMinPriceInput.value = "";
        resultMaxPriceInput.value = "";
        resultSortMode = "default";
        resultMinPriceFilter = "";
        resultMaxPriceFilter = "";
        renderChoices();
      });

      exportPdfBtn.addEventListener("click", exportCurrentResultsPdf);

      choicesBody.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action='edit-hotel-correction']");
        if (!button) return;
        const item = choiceByKey(button.dataset.choiceKey || "");
        submitHotelCorrection(item);
      });

      hotelCorrectionNameInput.addEventListener("input", () => {
        areaCorrectionError.classList.add("hidden");
      });

      hotelCorrectionNameInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        confirmAreaCorrectionDialog();
      });

      areaCorrectionInput.addEventListener("input", () => {
        areaCorrectionError.classList.add("hidden");
        renderAreaCorrectionSuggestions();
      });

      areaCorrectionInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        confirmAreaCorrectionDialog();
      });

      areaSuggestionList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-area-suggestion]");
        if (!button) return;
        areaCorrectionInput.value = button.dataset.areaSuggestion || "";
        areaCorrectionError.classList.add("hidden");
        renderAreaCorrectionSuggestions();
      });

      areaCorrectionSubmit.addEventListener("click", confirmAreaCorrectionDialog);

      areaCorrectionDialog.addEventListener("click", (event) => {
        if (!event.target.closest("[data-area-correction-cancel]")) return;
        closeAreaCorrectionDialog(null);
      });

      areaMergeNameInput.addEventListener("input", () => {
        areaMergeNameTouched = true;
        updateAreaMergeBar();
      });

      areaMergeSubmit.addEventListener("click", () => {
        submitAreaMergeCorrection();
      });

      areaMergeClear.addEventListener("click", () => {
        clearAreaMergeSelection();
      });

      areaRecommendations.addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-area-merge-checkbox]");
        if (!checkbox) return;
        const card = checkbox.closest(".area-card");
        if (!card) return;
        toggleAreaMergeSelection(card, checkbox.checked);
      });

      areaRecommendations.addEventListener("click", (event) => {
        const renameButton = event.target.closest("[data-area-rename]");
        if (renameButton) {
          const card = renameButton.closest(".area-card");
          submitAreaRenameCorrection(card);
          return;
        }
        if (event.target.closest("[data-area-merge-control]")) return;
        const card = event.target.closest(".area-card");
        if (!card) return;
        selectAreaCard(card);
      });

      areaRecommendations.addEventListener("keydown", (event) => {
        if (event.target.closest("[data-area-merge-control]")) return;
        if (!["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        const card = event.target.closest(".area-card");
        if (!card) return;
        selectAreaCard(card);
      });

      function refreshApprovedHotelCorrectionsForCurrentResults() {
        if (!lastChoices.length || result.classList.contains("hidden")) return;
        loadApprovedHotelNameCorrections({ city: lastResultCity, choices: lastChoices });
        loadApprovedHotelAreaCorrections({ city: lastResultCity, choices: lastChoices });
      }

      function refreshApprovedHotelAreasForCurrentResults() {
        refreshApprovedHotelCorrectionsForCurrentResults();
      }

      window.addEventListener("focus", refreshApprovedHotelCorrectionsForCurrentResults);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshApprovedHotelCorrectionsForCurrentResults();
      });

      floatingNavToggle.addEventListener("click", () => {
        setFloatingNavOpen(!floatingNav.classList.contains("is-open"));
      });

      floatingNavMenu.addEventListener("click", (event) => {
        const link = event.target.closest("[data-nav-target]");
        if (!link) return;
        const target = document.getElementById(link.dataset.navTarget || "");
        setFloatingNavOpen(false);
        if (!targetIsScrollable(target)) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      document.addEventListener("click", (event) => {
        if (floatingNav.contains(event.target)) return;
        setFloatingNavOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!areaCorrectionDialog.classList.contains("hidden")) closeAreaCorrectionDialog(null);
        setFloatingNavOpen(false);
      });

      resultSearchInput.addEventListener("input", () => {
        resultSearchQuery = normalizeSearchText(resultSearchInput.value);
        scheduleRenderChoices(80);
      });
    </script>
  </body>
